; =============================================================================
; pgbouncer.ini — SchoolHub connection pooler.
;
; *** POOL MODE IS A TENANT-ISOLATION CONTROL, NOT A PERFORMANCE KNOB. ***
;
; SchoolHub enforces tenant isolation with PostgreSQL Row-Level Security. The
; policy on every tenant-owned table reads:
;
;     USING (tenant_id = current_setting('app.tenant_id')::uuid)
;
; `app.tenant_id` is a session GUC. In TRANSACTION pooling, one PostgreSQL
; server connection is handed to a different client between every transaction,
; so anything set at SESSION scope survives into the next request — belonging to
; a different school.
;
;   -------------------------------------------------------------------------
;   FORBIDDEN in application code:   SET app.tenant_id = '<uuid>';
;   REQUIRED  in application code:   SET LOCAL app.tenant_id = '<uuid>';
;   -------------------------------------------------------------------------
;
; `SET LOCAL` is scoped to the surrounding transaction and is discarded by
; PostgreSQL at COMMIT or ROLLBACK, so tenant context can never outlive the
; transaction that set it, no matter how the connection is later reused.
;
; The failure mode of getting this wrong is silent: no error, no failing unit
; test, no log line — School A's staff simply start seeing School B's students
; under load, and only under load, because it only happens once connections are
; actually being multiplexed. This is why database-architecture.md §1.1 also
; forbids, in application code:
;
;   * session-level SET (of any GUC)
;   * session-scoped advisory locks (pg_advisory_lock — use *_xact_ variants)
;   * server-side prepared statements at session scope
;     (Django: CONN_MAX_AGE=0 and psycopg's prepare_threshold=None / server-side
;      binding disabled; Django 4.2+ sets this correctly when it detects a pooler
;      but it must be asserted in settings, not assumed)
;   * LISTEN / NOTIFY
;   * temporary tables that must outlive a transaction
;   * WITH HOLD cursors
;
; Django must therefore run with ATOMIC_REQUESTS = True (or an explicit
; transaction per unit of work), so that every request is already inside a
; transaction when the tenancy middleware issues its SET LOCAL.
;
; MIGRATIONS DO NOT GO THROUGH THIS POOLER. DDL, CREATE INDEX CONCURRENTLY,
; and role management are session-scoped operations; the migrator role connects
; directly to PostgreSQL on 5432. See postgres/init/02-app-role.sql.
;
; Spec: docs/02-architecture/database-architecture.md §1.1
;       docs/02-architecture/multi-tenancy.md §3
; =============================================================================

[databases]
; Client-visible name → upstream. The application's DATABASE_URL points at
; pgbouncer:6432/schoolhub and never mentions the real host.
schoolhub = host=postgres port=5432 dbname=schoolhub

; Staging/production override this section (or template it from IaC) with the
; managed instance endpoint; nothing else in this file changes between
; environments except pool sizes and TLS settings.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; ---------------------------------------------------------------------------
; Pooling
; ---------------------------------------------------------------------------
; transaction: a server connection is assigned for the duration of one
; transaction and returned to the pool at COMMIT/ROLLBACK. Required for the app
; role. Do not change this to `session` to "fix" a bug — a bug that goes away in
; session mode is a session-state leak that will come back in production.
pool_mode = transaction

max_client_conn = 500
default_pool_size = 25
; MUST stay 0: auth_type=scram-sha-256 with no plaintext password in [databases] relies
; on SCRAM passthrough — PgBouncer forwards the connecting CLIENT's own SCRAM exchange to
; authenticate its backend connection to PostgreSQL, rather than storing a plaintext
; credential of its own. That only works when a backend connection is opened synchronously
; as part of a real client login, i.e. there is live SCRAM material to forward. A nonzero
; min_pool_size makes PgBouncer eagerly warm up backend connections ahead of any client
; demand, with no client login in flight to forward — those connections fail with
; "cannot do SCRAM authentication: password is SCRAM secret but client authentication did
; not provide SCRAM keys". Confirmed by reproducing the failure at min_pool_size=5 and it
; disappearing at 0.
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3
; Hard ceiling per user+database pair; keeps one runaway service from starving
; the others out of PostgreSQL's max_connections.
max_db_connections = 80
max_user_connections = 80

; ---------------------------------------------------------------------------
; Authentication
; ---------------------------------------------------------------------------
; SCRAM end to end. `trust` and `md5` are not acceptable in any environment,
; including local development — dev is where habits are formed.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; The pooler itself must never be reachable as a superuser. The admin console
; is limited to a role that has no rights on the application database.
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

; ---------------------------------------------------------------------------
; Server-side connection hygiene
; ---------------------------------------------------------------------------
; RESET ALL + DISCARD ALL between transactions. Belt and braces: SET LOCAL is
; already discarded at commit, but if a code path ever issues a plain SET, this
; keeps the leak from crossing to the next client.
server_reset_query = DISCARD ALL
; In transaction pooling PgBouncer skips the reset query by default on the
; assumption the transaction cleaned up after itself. We do not accept that
; assumption for a multi-tenant database: pay the round trip.
server_reset_query_always = 1

; Ignore startup parameters the client sends that PgBouncer cannot track.
ignore_startup_parameters = extra_float_digits,options

server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 5
query_wait_timeout = 30
client_idle_timeout = 0
; Kill a client that opens a transaction and then goes quiet — an idle
; transaction holds a pooled server connection and its locks hostage.
idle_transaction_timeout = 60

; ---------------------------------------------------------------------------
; TLS
; ---------------------------------------------------------------------------
; Local compose runs on a private bridge network, so client TLS is disabled
; here. Staging and production MUST set:
;     client_tls_sslmode = require
;     server_tls_sslmode = verify-full
;     server_tls_ca_file = /etc/ssl/certs/rds-ca-bundle.pem
client_tls_sslmode = disable
server_tls_sslmode = prefer

; ---------------------------------------------------------------------------
; Logging
; ---------------------------------------------------------------------------
logfile =
pidfile =
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
verbose = 0
