          readOnly: true
        student_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        academic_session_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
          nullable: true
        attendance_date:
          type: string
          format: date
          description: Calendar date in the tenant's timezone.
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        check_in_time:
          type: string
          format: time
          nullable: true
          description: Set for a late arrival.
        check_out_time:
          type: string
          format: time
          nullable: true
          description: Set for an early departure or a half day.
        late_minutes:
          type: integer
          readOnly: true
          nullable: true
          description: Computed server-side from the tenant day window (§11); never
            client-supplied.
        leave_request_id:
          type: string
          format: uuid
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/AttendanceSourceEnum'
          readOnly: true
        marked_by:
          type: string
          format: uuid
          readOnly: true
          description: users(id) — the marking actor.
        is_locked:
          type: boolean
          description: |-
            The *effective* lock state, not the persisted column.

            `is_locked` is swept nightly, so between the window passing and the sweep
            running the column says False while every write path answers 409 — the
            service checks `row.is_locked or is_locked(row.attendance_date)`. A client
            rendering the column alone offered an edit that could not succeed. Same
            expression, one source.
