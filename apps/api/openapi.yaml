          nullable: true
          description: rooms(id) — default homeroom.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - campus_id
      - class_id
      - created_at
      - id
      - name
      - updated_at
    SessionClone:
      type: object
      description: Input for ``POST /academic-sessions/{id}:clone`` — the new session's
        identity.
      properties:
        name:
          type: string
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - name
      - start_date
    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        admission_number:
          type: string
          maxLength: 32
        user_id:
          type: string
          format: uuid
          nullable: true
          description: users(id) — portal account, tenant-checked at write time.
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        preferred_name:
          type: string
          nullable: true
          maxLength: 100
        date_of_birth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/GenderEnum'
        photo_file_id:
          type: string
          format: uuid
          nullable: true
          description: files(id) — promoted when core.files lands.
        campus_id:
          type: string
          format: uuid
        house_id:
          type: string
          format: uuid
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StudentStatusEnum'
          readOnly: true
        admission_date:
          type: string
          format: date
        blood_group:
          type: string
          nullable: true
          maxLength: 8
        nationality:
          type: string
          nullable: true
          maxLength: 80
        religion:
          type: string
          nullable: true
          description: Optional/sensitive; a tenant may disable.
          maxLength: 80
        previous_school:
          type: string
          nullable: true
          maxLength: 200
        medical_notes:
          type: string
          nullable: true
          description: Restricted visibility — see serializers.StudentSerializer.to_representation
            and core.audit.services._REDACTED_FIELDS.
        address:
          nullable: true
        custom_fields: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admission_date
      - campus_id
      - created_at
      - date_of_birth
      - first_name
      - gender
      - id
      - last_name
      - status
      - updated_at
    StudentStatusEnum:
      enum:
      - active
      - suspended
      - transferred
      - withdrawn
      - graduated
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `transferred` - Transferred
        * `withdrawn` - Withdrawn
        * `graduated` - Graduated
    Subject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
        subject_type:
          $ref: '#/components/schemas/SubjectTypeEnum'
        department_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
          maxLength: 300
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    SubjectTypeEnum:
      enum:
      - core
      - elective
      - co_curricular
      type: string
      description: |-
        * `core` - Core
        * `elective` - Elective
        * `co_curricular` - Co-curricular
    Term:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_session_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        sequence:
          type: integer
          maximum: 32767
          minimum: 0
          description: Order within the session, 1-based.
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_session_id
      - created_at
      - end_date
      - id
      - name
      - sequence
      - start_date
      - updated_at
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
          nullable: true
          description: School-issued login for students without email.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_platform:
          type: boolean
          readOnly: true
          description: Platform-scope principal (no tenant).
        mfa_enabled:
          type: boolean
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - first_name
      - full_name
      - id
      - is_platform
      - last_name
      - mfa_enabled
      - permissions
      - phone
      - roles
      - tenant
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
