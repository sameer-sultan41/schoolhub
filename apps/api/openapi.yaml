  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      description: The authenticated principal, with effective permissions for UI
        gating.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Rotating refresh. Reuse of a rotated token invalidates the family (theft detection).

        The refresh token travels only in ``REFRESH_COOKIE_NAME`` — never in the request
        body — so this cannot reuse ``TokenRefreshView`` (which reads the body) even though
        it delegates the actual rotation logic to simplejwt's own serializer.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
