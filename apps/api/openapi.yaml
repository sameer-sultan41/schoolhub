        The scale is taken from the URL on the nested route, not from the body, so
        `grading_scale_id` is read-only: a band posted to one scale's collection
        naming another scale in its payload is a request with two answers.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        grading_scale_id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          description: e.g. A+, B, Pass.
          maxLength: 10
        min_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Inclusive.
        max_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Inclusive.
        grade_point:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: For GPA scales.
        is_passing:
          type: boolean
        remark:
          type: string
          nullable: true
          maxLength: 100
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedGradingScale:
      type: object
      description: |-
        `grading_scales` — a tenant's grading model (§5.5).

        `bands` is nested read-only. A scale is only meaningful with its bands, and
        a client rendering a result needs both in one round trip; writes go through
        the nested `/grade-bands` route so each band gets its own validation and its
        own audit entry.

        `is_default` is read-only here and moves through `:set-default` instead. The
        partial unique index refuses two live defaults, so a plain PATCH setting it
        true would 409 against whichever scale currently holds it — the caller's
        intent is "make this the default", which is two writes, not one.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        scale_type:
          $ref: '#/components/schemas/GradingScaleTypeEnum'
        gpa_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: e.g. 4.00 or 5.00. Required for a gpa or hybrid scale.
        is_default:
          type: boolean
