          maxLength: 50
        sequence:
          type: integer
          maximum: 32767
          minimum: 0
          description: Daily order, 1-based.
        start_time:
          type: string
          format: time
          description: Local to the tenant/campus timezone.
        end_time:
          type: string
          format: time
        is_break:
          type: boolean
          description: Breaks are never schedulable (§5.1).
        weekdays:
          nullable: true
          description: Applicable weekdays as 0-6; null = the tenant's working days.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
