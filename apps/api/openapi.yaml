          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicSession'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSession'
          description: ''
  /api/v1/academic-sessions/{id}:activate:
    post:
      operationId: academic_sessions_:activate_create
      description: |-
        Academic sessions and their lifecycle (module doc §5.4, §7).

        No destroy: §16 exposes no DELETE and §4 grants no delete key. A session that
        should no longer be used is closed, which keeps its history addressable.
      summary: Activate an academic session
      parameters:
