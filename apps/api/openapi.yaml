        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                next_cursor:
                  type: string
                  nullable: true
                previous_cursor:
                  type: string
                  nullable: true
                page_size:
                  type: integer
    PaginatedDesignationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Designation'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                next_cursor:
                  type: string
                  nullable: true
                previous_cursor:
                  type: string
                  nullable: true
                page_size:
                  type: integer
    PaginatedEmergencyContactList:
      type: object
