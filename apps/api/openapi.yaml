  /api/v1/timetables/{id}:publish:
    post:
      operationId: timetables_:publish_create
      description: |-
        The section-level actions: `:validate` and `:publish` (§16).

        Both are colon-actions on a *section* id, addressed as `/timetables/{id}`
        because what they act on is that section's timetable rather than any one row
        of it. Neither is `@action`-decorated — the routes are explicit `path()`
        entries in urls.py, placed before the routers so the verb is not parsed as a
        primary key.
      summary: Publish a section's draft timetable
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - timetables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Rows published and superseded, plus the accepted soft conflicts.
        '422':
          description: A hard conflict, a locked session, or no draft to publish.
  /api/v1/timetables/{id}:validate:
    post:
      operationId: timetables_:validate_create
      description: |-
        The section-level actions: `:validate` and `:publish` (§16).

        Both are colon-actions on a *section* id, addressed as `/timetables/{id}`
        because what they act on is that section's timetable rather than any one row
        of it. Neither is `@action`-decorated — the routes are explicit `path()`
        entries in urls.py, placed before the routers so the verb is not parsed as a
        primary key.
      summary: Run the full conflict check over a section's timetable
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - timetables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: '`conflicts` is the machine-readable list `{type, severity,
            slot_ids, message}` (§6); `has_hard_conflicts` says whether publish would
            be refused.'
  /api/v1/timetables/my:
    get:
      operationId: timetables_my_retrieve
      description: |-
        `GET /timetables/my` — the caller's own effective timetable (§16).

        The **only** endpoint in this module a student or guardian reaches, and
        therefore the only viewset here without ``DenyRestrictedPrincipals``. It
        serves published rows exclusively (``services.effective_slots_for``), so
        §5.7's "unpublished edits never leak" holds by construction rather than by a
        filter someone has to remember.

        Date-aware: a substitution overrides one cell for specific dates only (§7.2),
        so asking without a date gives the base grid and asking with one gives what
        actually happens that day.
      summary: The caller's own effective timetable
      parameters:
      - in: query
        name: academic_session_id
        schema:
          type: string
          format: uuid
        description: Defaults to the tenant's current session.
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Apply confirmed substitutions for this date. Omitted = the base
          grid.
      tags:
      - timetables
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EffectiveSlot'
          description: Published cells with confirmed substitutions applied for `?date=`.
            `meta.audience` says which principal was resolved.
components:
  schemas:
    AcademicSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: School year label, e.g. "2026–27".
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicSessionStatusEnum'
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - is_current
      - name
      - start_date
      - status
      - updated_at
    AcademicSessionStatusEnum:
      enum:
      - planned
      - active
      - closed
      - archived
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
        * `archived` - Archived
    BackgroundJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_type:
          type: string
          readOnly: true
          description: e.g. 'import.students', 'export.students', 'id-cards.generate'.
        status:
          allOf:
          - $ref: '#/components/schemas/BackgroundJobStatusEnum'
          readOnly: true
        progress:
          type: integer
          readOnly: true
        result:
          readOnly: true
          nullable: true
          description: Result summary, e.g. result_file_id.
        error:
          type: string
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error
      - finished_at
      - id
      - job_type
      - progress
      - result
      - started_at
      - status
      - updated_at
    BackgroundJobStatusEnum:
      enum:
      - queued
      - running
      - succeeded
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
    Campus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 20
        address:
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        timezone:
          type: string
          nullable: true
          description: IANA identifier. Null inherits the tenant timezone.
          maxLength: 64
        head_staff_id:
          type: string
          format: uuid
          nullable: true
          description: staff(id) — campus head.
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - current_password
      - new_password
    ChangeSectionRequest:
      type: object
      properties:
        section_id:
          type: string
          format: uuid
        roll_number:
          type: string
          nullable: true
          maxLength: 16
        capacity_override_reason:
          type: string
          nullable: true
      required:
      - section_id
    Class:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        code:
          type: string
          nullable: true
          maxLength: 20
        level:
          type: integer
          maximum: 32767
          minimum: 0
          description: Promotion ordering; the next level up is the promotion target.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - level
      - name
      - updated_at
    CloneCurriculumRequest:
      type: object
      properties:
        source_academic_session_id:
          type: string
          format: uuid
        target_academic_session_id:
          type: string
          format: uuid
      required:
      - source_academic_session_id
      - target_academic_session_id
    CreatePromotionBatch:
      type: object
      properties:
        from_academic_session_id:
          type: string
          format: uuid
        to_academic_session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
      required:
      - class_id
      - from_academic_session_id
      - to_academic_session_id
    Curriculum:
      type: object
      description: |-
        `class_subjects` through the academics contract (§16).

        The model lives in school_organization — see apps/academics/models.py's
        header for why it stays there — but the validations are academics' §11.
      properties:
        id:
          type: string
