  /api/v1/staff-attendance:
    get:
      operationId: staff_attendance_list
      description: |-
        `staff_attendance` — §5.2, and §16's `POST /staff-attendance` + `:check-out`.

        `DenyRestrictedPrincipals` on every action, unlike the student register: §4
        grants `attendance.staff-attendance.view` to "every staff role (own)" and to
        no restricted principal at all. A student has no business reading a teacher's
        arrival time.

        That "every staff role (own)" is the widest `own` grant on the platform, and
        it is why `POST` is keyed separately: reading your own punctuality and
        recording someone else's are different acts, and §4 keys the second to
        `hr_staff`/`school_admin`.

        **Self check-in is `source="self"`, and only for yourself.** §5.2 allows a
        staff member to record their own arrival, which no student may do; recording
        it as `manual` would make §13's report unable to tell a self-report from an
        HR-verified one.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: date__gte
        schema:
          type: string
          format: date
      - in: query
        name: date__lte
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - device
          - import
          - manual
          - self
        description: |-
          * `manual` - Manual
          * `self` - Self check-in
          * `import` - Import
          * `device` - Device
      - in: query
        name: staff_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - absent
          - half_day
          - holiday
          - late
          - on_leave
          - present
        description: |-
          * `present` - Present
          * `absent` - Absent
          * `late` - Late
          * `half_day` - Half day
          * `on_leave` - On leave
          * `holiday` - Holiday
      tags:
      - staff-attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffAttendanceList'
          description: ''
    post:
      operationId: staff_attendance_create
      description: |-
