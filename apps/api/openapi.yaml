      - executed
      - reverted
      type: string
      description: |-
        * `draft` - Draft
        * `pending_approval` - Pending approval
        * `approved` - Approved
        * `executed` - Executed
        * `reverted` - Reverted
    QualificationTypeEnum:
      enum:
      - degree
      - diploma
      - certification
      - training
      - license
      type: string
      description: |-
        * `degree` - Degree
        * `diploma` - Diploma
        * `certification` - Certification
        * `training` - Training
        * `license` - License
    Question:
      type: object
      description: |-
        `questions` — §5.8, with §7.2's approval gate on the wire.

        `is_approved` and `approved_by` are **read-only**. §7.2 makes approval a
        permission-gated act (`exams.question.approve`), so a client that could set
        the flag on create would be the whole gate defeated — an AI draft could
        arrive pre-approved. `:approve` is the only way it becomes true for an
        `ai_generated` question.

        `usage_count` is read-only for the same shape of reason: it is the only
        record that a question reached a paper (§15 gives assembled papers no
        table), so nothing but assembly may write it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        question_bank_id:
          type: string
          format: uuid
          readOnly: true
        question_text:
          type: string
        question_type:
          $ref: '#/components/schemas/QuestionTypeEnum'
        difficulty:
          $ref: '#/components/schemas/QuestionDifficultyEnum'
        default_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        options:
          nullable: true
          description: Required for mcq and true_false.
        answer_key:
          nullable: true
        topic:
          type: string
          nullable: true
          description: The blueprint filter (§6).
          maxLength: 150
        source:
          $ref: '#/components/schemas/QuestionSourceEnum'
        is_approved:
          type: boolean
          readOnly: true
          description: False on creation for ai_generated; flipped by :approve.
        usage_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_approved
      - question_bank_id
      - question_text
      - question_type
      - updated_at
      - usage_count
    QuestionBank:
      type: object
      description: '`question_banks` — §5.8.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
          $ref: '#/components/schemas/QuestionBankStatusEnum'
        question_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - question_count
      - subject_id
      - updated_at
    QuestionBankStatusEnum:
      enum:
      - active
      - archived
      type: string
      description: |-
        * `active` - Active
        * `archived` - Archived
    QuestionDifficultyEnum:
      enum:
      - easy
      - medium
      - hard
      type: string
      description: |-
        * `easy` - Easy
        * `medium` - Medium
        * `hard` - Hard
    QuestionSourceEnum:
      enum:
      - manual
      - ai_generated
      - imported
      type: string
      description: |-
        * `manual` - Manual
        * `ai_generated` - AI generated
        * `imported` - Imported
    QuestionTypeEnum:
      enum:
      - mcq
