openapi: 3.0.3
info:
  title: SchoolHub API
  version: 1.0.0
  description: Multi-tenant School Management SaaS — see the specification in docs/.
paths:
  /api/v1/academic-sessions:
    get:
      operationId: academic_sessions_list
      description: |-
        Academic sessions and their lifecycle (module doc §5.4, §7).

        No destroy: §16 exposes no DELETE and §4 grants no delete key. A session that
        should no longer be used is closed, which keeps its history addressable.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: is_current
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
          - closed
          - planned
        description: |-
          * `planned` - Planned
          * `active` - Active
          * `closed` - Closed
          * `archived` - Archived
      tags:
      - academic-sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicSessionList'
          description: ''
    post:
      operationId: academic_sessions_create
      description: |-
        Academic sessions and their lifecycle (module doc §5.4, §7).

        No destroy: §16 exposes no DELETE and §4 grants no delete key. A session that
        should no longer be used is closed, which keeps its history addressable.
      tags:
      - academic-sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicSession'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSession'
          description: ''
  /api/v1/academic-sessions/{id}:
    get:
      operationId: academic_sessions_retrieve
      description: |-
        Academic sessions and their lifecycle (module doc §5.4, §7).

        No destroy: §16 exposes no DELETE and §4 grants no delete key. A session that
        should no longer be used is closed, which keeps its history addressable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic session.
        required: true
      tags:
      - academic-sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSession'
          description: ''
    put:
      operationId: academic_sessions_update
      description: |-
        Academic sessions and their lifecycle (module doc §5.4, §7).

        No destroy: §16 exposes no DELETE and §4 grants no delete key. A session that
        should no longer be used is closed, which keeps its history addressable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic session.
        required: true
      tags:
