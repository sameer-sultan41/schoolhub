        Routed under `/exams` rather than `/exam-schedules` because it is the
        *exam* that moves state: a schedule is published as a whole, not sitting
        by sitting, and §6 calls it "schedule publish to portals".
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: exam_date
        schema:
          type: string
          format: date
      - in: query
        name: exam_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: exam_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: exam_id
        schema:
          type: string
          format: uuid
      - in: query
        name: exam_subject_id
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: invigilator_staff_id
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: room_id
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: section_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - scheduled
        description: |-
          * `scheduled` - Scheduled
          * `completed` - Completed
          * `cancelled` - Cancelled
      tags:
      - exams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamScheduleList'
          description: ''
