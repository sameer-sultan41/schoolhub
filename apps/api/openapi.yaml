            $ref: '#/components/schemas/EmergencyContact'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                next_cursor:
                  type: string
                  nullable: true
                previous_cursor:
                  type: string
                  nullable: true
                page_size:
                  type: integer
    PaginatedFileList:
