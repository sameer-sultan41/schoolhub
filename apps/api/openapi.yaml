  /api/v1/student-promotions:
    get:
      operationId: student_promotions_list
      description: |-
        `/student-promotions` — the batch resource (§16).

        Every `{id}` on this prefix is a **batch id**. That was not true before: GET
        and PATCH resolved a decision-row id while the colon-actions resolved a batch
        id, so one path prefix carried two id spaces and a client could not tell
        which it held. Decisions are now a sub-resource keyed by student, which is
        also the shape §16 describes.

        A batch has no table — it is aggregated from its rows (see
        `PromotionBatchSerializer`), so this list is read-only and `create` is the
        dedicated `create_batch` handler below.
      parameters:
      - in: query
        name: batch_id
        schema:
          type: string
          format: uuid
      - in: query
        name: decision
        schema:
          type: string
          enum:
          - graduated
          - promoted
          - promoted_on_trial
          - retained
        description: |-
          * `promoted` - Promoted
          * `retained` - Retained
          * `promoted_on_trial` - Promoted on trial
          * `graduated` - Graduated
      - in: query
        name: from_academic_session_id
        schema:
          type: string
          format: uuid
      - in: query
        name: from_class_id
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - draft
          - executed
          - pending_approval
          - reverted
        description: |-
          * `draft` - Draft
          * `pending_approval` - Pending approval
          * `approved` - Approved
          * `executed` - Executed
          * `reverted` - Reverted
      - in: query
        name: student_id
        schema:
          type: string
          format: uuid
      - in: query
        name: to_academic_session_id
        schema:
          type: string
          format: uuid
      tags:
      - student-promotions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPromotionBatchList'
          description: ''
    post:
      operationId: student_promotions_create
      description: |-
        `/student-promotions` — the batch resource (§16).

        Every `{id}` on this prefix is a **batch id**. That was not true before: GET
        and PATCH resolved a decision-row id while the colon-actions resolved a batch
        id, so one path prefix carried two id spaces and a client could not tell
        which it held. Decisions are now a sub-resource keyed by student, which is
        also the shape §16 describes.

        A batch has no table — it is aggregated from its rows (see
        `PromotionBatchSerializer`), so this list is read-only and `create` is the
        dedicated `create_batch` handler below.
      summary: Create a promotion batch for one class
      tags:
      - student-promotions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionBatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePromotionBatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePromotionBatch'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: The new batch id and its row count.
  /api/v1/student-promotions/{batch_pk}/decisions/{student_pk}:
    patch:
      operationId: student_promotions_decisions_partial_update
      description: |-
        `/student-promotions/{batch_id}/decisions/{student_id}` — §16's shape.

