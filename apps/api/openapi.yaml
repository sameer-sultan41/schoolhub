  /api/v1/class-subjects:
    get:
      operationId: class_subjects_list
      description: |-
        Curriculum mapping of subjects onto classes for one session.

        Shares the subject permission keys: mapping a subject to a class is subject
        management, and §4 declares no separate key for it.
      parameters:
      - in: query
        name: academic_session_id
        schema:
          type: string
          format: uuid
      - in: query
        name: campus_id
        schema:
          type: string
          format: uuid
      - in: query
        name: class_id
        schema:
          type: string
          format: uuid
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: elective_group
        schema:
          type: string
      - in: query
        name: is_elective
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
