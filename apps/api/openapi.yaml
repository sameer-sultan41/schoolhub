      type: object
      description: |-
        ``GET/PUT /api/v1/holiday-calendar`` (§16).

        PUT replaces each list it names wholesale, which is why this is a PUT and not
        a PATCH: merging entry by entry would leave no way to *remove* a holiday, and
        removing one is exactly what a cancelled closure needs.
      properties:
        working_days:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
          description: 0=Monday. Omit to leave the configured week unchanged.
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/HolidayEntry'
    HolidayEntry:
      type: object
      description: |-
        One holiday or holiday range — module doc §5.8.

        ``campus_id`` is a plain ``UUIDField`` rather than a ``PrimaryKeyRelatedField``
        because these entries live inside JSONB, where there is no foreign key to do
        the ownership check for us. ``validate_campus_id`` does it explicitly, or a
        smuggled foreign id would be stored unchallenged and then silently ignored by
        ``calendar.holiday_name`` — a closure an admin believes they configured and
        which never takes effect.

        ``start_date``/``end_date`` rather than §16's filter names ``from``/``to``:
        ``from`` is a Python keyword, so it can be neither a serializer attribute nor
        a comfortable key for any Python that later reads the stored entry. §16 uses
        ``from``/``to`` for *query parameters*, which is a different namespace, and
        those filters are not built (the resource is a singleton document).
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        name:
          type: string
          maxLength: 120
        campus_id:
          type: string
          format: uuid
          nullable: true
      required:
      - name
      - start_date
    House:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        code:
          type: string
          nullable: true
          maxLength: 20
        color:
          type: string
          nullable: true
          description: Token or hex.
          maxLength: 20
        motto:
          type: string
          nullable: true
          maxLength: 200
        house_master_staff_id:
          type: string
          format: uuid
          nullable: true
          description: staff(id).
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    IdCardGenerateRequest:
      type: object
      properties:
        student_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required:
      - student_ids
    InviteRequest:
      type: object
      description: |-
        No email is sent (§17 gap — no notification infrastructure exists yet,
        see services.invite_staff's docstring); this only creates and links the
        account plus assigns the requested roles.
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
    IssueVoucher:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/VoucherProviderEnum'
        validity_days:
          type: integer
          maximum: 365
          minimum: 1
      required:
      - provider
    LeaveApproval:
      type: object
      description: One step of §7.2's chain, nested on the request it belongs to.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        level:
          type: integer
          readOnly: true
          description: 1-based step order.
        required_permission:
          type: string
          readOnly: true
          description: e.g. attendance.leave-request.approve.
        approver_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: users(id); set on decision, differs from submitted_by.
        decision:
          allOf:
          - $ref: '#/components/schemas/LeaveApprovalDecisionEnum'
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        note:
          type: string
          readOnly: true
          nullable: true
      required:
      - approver_id
      - decided_at
      - decision
      - id
      - level
      - note
      - required_permission
    LeaveApprovalDecisionEnum:
      enum:
      - pending
      - approved
      - rejected
      - skipped
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `skipped` - Skipped
    LeaveDecision:
      type: object
      description: |-
        Body for `:approve` / `:reject` — an optional note, nothing else.

        The decision is the route rather than a field, for the reason
        `CorrectionDecisionSerializer` gives: one endpoint taking `{"approve": bool}`
        could not be permission-gated differently for the two outcomes.
      properties:
        note:
          type: string
          nullable: true
          maxLength: 500
    LeaveRequest:
      type: object
      description: |-
        `leave_requests` — the student half (§16).

        `days_count` is read-only because §11 computes it net of holidays, and
        `status`/`current_approval_level`/`decided_at` because they move only through
        the colon-actions. A writable `days_count` would let a client understate a
        fortnight to duck the escalation threshold.

        The chain is nested rather than fetched separately: a requester's first
        question is "how many people have to say yes", and §16 declares no
        `/leave-requests/{id}/approvals` sub-resource to ask it with.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        requester_type:
          allOf:
          - $ref: '#/components/schemas/AttendanceCorrectionSubjectTypeEnum'
          readOnly: true
        student_id:
          type: string
          format: uuid
        submitted_by:
          type: string
          format: uuid
          readOnly: true
          description: users(id); a guardian may submit for a student.
        leave_type_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        day_part:
          $ref: '#/components/schemas/DayPartEnum'
        days_count:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          readOnly: true
          description: Computed net of holidays (§11).
        reason:
          type: string
          maxLength: 1000
        attachment_file_id:
          type: string
          format: uuid
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceCorrectionStatusEnum'
          readOnly: true
        current_approval_level:
          type: integer
          readOnly: true
          description: Step pointer into the tenant's approval chain (§7.2).
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/LeaveApproval'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approvals
      - created_at
      - current_approval_level
      - days_count
      - decided_at
      - end_date
      - id
      - leave_type_id
      - reason
      - requester_type
      - start_date
      - status
      - student_id
      - submitted_by
      - updated_at
    LeaveType:
      type: object
      description: '`leave_types` — read-only here. See views.py for why writes are
        hr-leave''s.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: e.g. "Sick Leave".
        code:
          type: string
          readOnly: true
        applies_to:
          allOf:
          - $ref: '#/components/schemas/AppliesToEnum'
          readOnly: true
        is_paid:
          type: boolean
          readOnly: true
          description: Staff payroll relevance only; meaningless for a student.
        requires_attachment:
          type: boolean
          readOnly: true
          description: e.g. a medical note (§6).
        max_consecutive_days:
          type: integer
          readOnly: true
          nullable: true
          description: Null = unlimited.
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applies_to
      - code
      - created_at
      - id
      - is_active
      - is_paid
      - max_consecutive_days
      - name
      - requires_attachment
      - updated_at
    LedgerAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 120
        account_type:
          $ref: '#/components/schemas/LedgerAccountTypeEnum'
        parent:
          type: string
          format: uuid
          nullable: true
        is_system:
          type: boolean
          readOnly: true
          description: Seeded at provisioning; cannot be deleted (see the delete constraint).
        is_active:
          type: boolean
          description: Archived accounts reject new postings but keep their history.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_type
      - code
      - created_at
      - id
      - is_system
      - name
      - updated_at
    LedgerAccountTypeEnum:
      enum:
      - asset
      - liability
      - equity
      - income
      - expense
      type: string
      description: |-
        * `asset` - Asset
        * `liability` - Liability
        * `equity` - Equity
        * `income` - Income
        * `expense` - Expense
    LedgerEntry:
      type: object
      description: |-
        Read-only. Postings are made by `ledger.post_transaction`, never by a POST.

        There is no create path on this serializer on purpose: a client that could
        insert a single line could insert an unbalanced posting, and the balance rule
        is about the set. `LedgerEntryViewSet` exposes list and retrieve only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        transaction_id:
          type: string
          format: uuid
          readOnly: true
          description: Groups the balanced lines of one posting. Assigned by ledger.post_transaction.
        entry_date:
          type: string
          format: date
          readOnly: true
          description: Posting date, which is not always the creation date.
        ledger_account:
          type: string
          format: uuid
          readOnly: true
        account_code:
          type: string
          readOnly: true
        account_name:
          type: string
          readOnly: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        reference_type:
          allOf:
          - $ref: '#/components/schemas/LedgerReferenceTypeEnum'
          readOnly: true
        reference_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The origin record, per reference_type. Null for a manual journal,
            which has no platform record behind it.
        memo:
          type: string
          readOnly: true
          nullable: true
        reversed_by_transaction_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Set when a reversal supersedes this posting. The only mutable
            column.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_code
      - account_name
      - created_at
      - credit
      - debit
      - entry_date
      - id
      - ledger_account
      - memo
      - reference_id
      - reference_type
      - reversed_by_transaction_id
      - transaction_id
    LedgerLine:
      type: object
      description: One line of a manual journal entry.
      properties:
        ledger_account:
          type: string
          format: uuid
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        memo:
          type: string
          nullable: true
          maxLength: 255
      required:
      - ledger_account
    LedgerReferenceTypeEnum:
      enum:
      - payment
      - refund
      - expense
      - payroll_run
      - fine
      - manual
      - reversal
      type: string
      description: |-
        * `payment` - Payment
        * `refund` - Refund
        * `expense` - Expense
        * `payroll_run` - Payroll run
        * `fine` - Fine
        * `manual` - Manual journal
        * `reversal` - Reversal
    Login:
      type: object
      description: |-
        Email/username + password login.

        Deliberately returns the same generic error for unknown accounts and wrong
        passwords so the endpoint cannot be used to enumerate who has an account at
        a school.
      properties:
        identifier:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        school:
          type: string
          writeOnly: true
          description: Tenant slug. Required only when the identifier exists at more
            than one school.
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - identifier
      - password
    ManualJournal:
      type: object
      description: '`POST /ledger-entries:post-journal` — §8''s hand-written journal
        entry.'
      properties:
        entry_date:
          type: string
          format: date
        memo:
          type: string
          maxLength: 255
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LedgerLine'
      required:
      - entry_date
      - lines
      - memo
    Marks:
      type: object
      description: |-
        `marks` — read shape for `GET /marks` (§16).

        Writes go through `:bulk-entry`, not through this serializer: §16 declares a
        `GET` and one colon-action, and a per-row create would bypass the window,
        the lock, the allocation check and the eligible-roll check that the grid
        path applies together.

        `status` is readable but not settable here for the same reason — `locked` is
        `:lock-marks`'s to set, and a client that could write it would close its own
        window.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exam_subject_id:
          type: string
          format: uuid
          readOnly: true
        student_id:
          type: string
          format: uuid
          readOnly: true
        theory_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Null when the student was absent or exempt.
        practical_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        is_absent:
          type: boolean
          readOnly: true
          description: Mutually exclusive with a mark (§11).
        is_exempt:
          type: boolean
          readOnly: true
          description: Excluded from the aggregate rather than scored zero.
        status:
          allOf:
          - $ref: '#/components/schemas/MarksStatusEnum'
          readOnly: true
        remarks:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - exam_subject_id
      - id
      - is_absent
      - is_exempt
      - practical_marks
      - remarks
      - status
      - student_id
      - theory_marks
      - updated_at
    MarksEntry:
      type: object
      description: |-
        One cell of the grid `:bulk-entry` submits.

        `student_id` is a plain `UUIDField`, not a `PrimaryKeyRelatedField`: the
        service checks eligibility against the exam-subject's own roll and reports
        an ineligible student through `error.meta.rows` with its index, which is
        what a grid needs in order to highlight the cell. A related field would
        turn the first bad id into a flat 400 naming no row.
      properties:
        student_id:
          type: string
          format: uuid
        theory_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        practical_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        is_absent:
          type: boolean
          default: false
        is_exempt:
          type: boolean
          default: false
        status:
          allOf:
          - $ref: '#/components/schemas/MarksEntryStatusEnum'
          default: draft
        remarks:
          type: string
          nullable: true
          maxLength: 255
      required:
      - student_id
    MarksEntryStatusEnum:
      enum:
      - draft
      - submitted
      type: string
      description: |-
        * `draft` - draft
        * `submitted` - submitted
    MarksImportRequest:
      type: object
      description: The body of `POST /marks-imports` — a multipart CSV or .xlsx upload.
      properties:
        exam_subject_id:
          type: string
          format: uuid
        file:
          type: string
          format: uri
      required:
      - exam_subject_id
      - file
    MarksStatusEnum:
      enum:
      - draft
      - submitted
      - locked
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `locked` - Locked
    Notice:
