      - name
      - sequence
      - start_time
      - updated_at
    PromotionBatch:
      type: object
      description: |-
        A batch, synthesised by aggregating its decision rows.

        There is no `promotion_batches` table — `batch_id` is a grouping column and
        status moves batch-wide, which entities/academics.md settles explicitly. So
        a batch is read-only and derived: its existence, status and shape are
        consequences of its rows rather than a parent record that can drift out of
        sync with them.

        `status` is grouped on rather than picked from a row. If a batch ever
        contained mixed statuses it would surface here as two entries for one
        `batch_id`, which is the honest rendering of a corrupt batch rather than a
        silently chosen winner.
      properties:
        batch_id:
          type: string
          format: uuid
        from_academic_session_id:
          type: string
          format: uuid
        to_academic_session_id:
          type: string
          format: uuid
        from_class_id:
          type: string
          format: uuid
        status:
          type: string
        students:
          type: integer
        started_at:
          type: string
          format: date-time
      required:
      - batch_id
      - from_academic_session_id
      - from_class_id
      - started_at
      - status
      - students
      - to_academic_session_id
    PromotionDecision:
      type: object
      description: |-
        A single student's row inside a batch.

        Only the fields a reviewer edits are writable; everything that defines which
        batch this is, and where the student came from, is fixed at batch creation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        batch_id:
          type: string
          format: uuid
          readOnly: true
          description: Logical batch grouping — one per class per rollover. No batch
            table.
        student_id:
          type: string
          format: uuid
          readOnly: true
        student_name:
          type: string
          readOnly: true
        admission_number:
          type: string
          readOnly: true
        from_enrollment_id:
          type: string
          format: uuid
          readOnly: true
        from_academic_session_id:
          type: string
          format: uuid
          readOnly: true
        to_academic_session_id:
          type: string
          format: uuid
          readOnly: true
        from_class_id:
          type: string
          format: uuid
          readOnly: true
        to_class_id:
          type: string
          format: uuid
          nullable: true
        to_section_id:
          type: string
          format: uuid
          nullable: true
        decision:
          $ref: '#/components/schemas/PromotionDecisionEnum'
        decision_basis:
          readOnly: true
          nullable: true
          description: Snapshot of result aggregates, attendance %, rule evaluation
            at proposal time.
        override_reason:
          type: string
          nullable: true
          description: Required when the decision deviates from the rule proposal.
          maxLength: 500
        remarks:
          type: string
          nullable: true
          maxLength: 500
        status:
          allOf:
          - $ref: '#/components/schemas/PromotionDecisionStatusEnum'
          readOnly: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: users(id) — must differ from the preparer.
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        executed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admission_number
      - approved_at
      - approved_by
      - batch_id
      - created_at
      - decision
      - decision_basis
      - executed_at
      - from_academic_session_id
      - from_class_id
      - from_enrollment_id
      - id
      - status
      - student_id
      - student_name
      - to_academic_session_id
      - updated_at
