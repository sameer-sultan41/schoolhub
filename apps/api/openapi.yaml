    EffectiveSlot:
      type: object
      description: |-
        One cell of the caller's effective timetable (§16 `GET /timetables/my`).

        Denormalised deliberately: this is the one endpoint a student, a guardian and
        a teacher all reach, on a phone, and the alternative to inlining the period
        and subject names is four lookups per cell in the client.

        `substitution` comes from the `overrides` map `services.effective_slots_for`
        returns, passed in through the serializer context — never re-queried per row,
        which on a forty-cell week would be forty round trips.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        day_of_week:
          type: integer
          maximum: 32767
          minimum: 0
          description: 0-6; the week's start comes from tenant configuration.
        period_id:
          type: string
          format: uuid
          readOnly: true
        period_name:
          type: string
          readOnly: true
        period_sequence:
          type: integer
          readOnly: true
        start_time:
          type: string
          format: time
          readOnly: true
        end_time:
          type: string
          format: time
          readOnly: true
        section_id:
          type: string
          format: uuid
          readOnly: true
        section_name:
          type: string
          readOnly: true
        subject_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        subject_name:
          type: string
          readOnly: true
          nullable: true
        staff_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        staff_name:
          type: string
          nullable: true
          readOnly: true
        room_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        room_name:
          type: string
          readOnly: true
          nullable: true
        notes:
          type: string
          nullable: true
          description: Per-cell note, e.g. "double period".
          maxLength: 200
        substitution:
          allOf:
          - $ref: '#/components/schemas/SlotSubstitution'
          nullable: true
          readOnly: true
      required:
      - day_of_week
      - end_time
      - id
      - period_id
      - period_name
      - period_sequence
      - room_id
      - room_name
      - section_id
      - section_name
      - staff_id
      - staff_name
      - start_time
      - subject_id
      - subject_name
      - substitution
    EmergencyContact:
      type: object
