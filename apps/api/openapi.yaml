        id:
          type: string
          format: uuid
          readOnly: true
        staff_id:
          type: string
          format: uuid
        attendance_date:
          type: string
          format: date
          description: Calendar date in the tenant's timezone.
        status:
          $ref: '#/components/schemas/StaffAttendanceStatusEnum'
        check_in_time:
          type: string
          format: time
          nullable: true
        check_out_time:
          type: string
          format: time
          nullable: true
          description: Must be later than check_in_time (§11).
        late_minutes:
          type: integer
          readOnly: true
          nullable: true
          description: Computed server-side from the tenant work-day window; never
            client-supplied.
        early_departure_minutes:
          type: integer
          readOnly: true
          nullable: true
          description: Computed server-side, like late_minutes.
        leave_request_id:
          type: string
          format: uuid
          nullable: true
          description: Set when status is on_leave; written by hr-leave's approval
            flow.
          readOnly: true
        source:
          $ref: '#/components/schemas/StaffAttendanceSourceEnum'
        marked_by:
          type: string
          format: uuid
          readOnly: true
          description: users(id) — the recording actor.
        is_locked:
          type: boolean
          readOnly: true
        remarks:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attendance_date
      - created_at
      - early_departure_minutes
      - id
      - is_locked
      - late_minutes
      - leave_request_id
      - marked_by
      - staff_id
      - status
      - updated_at
