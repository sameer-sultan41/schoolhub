  /api/v1/timetable-slots:
    get:
      operationId: timetable_slots_list
      description: |-
        `timetable_slots` — the weekly grid, cell by cell (§5.2).

        **Every mutation returns `meta.conflicts` and still saves.** §5.5 draws the
        line at publish, not at save: hard conflicts block
        `:publish`, while a grid mid-build is allowed to be temporarily wrong —
        an admin who cannot save an in-progress state cannot build a timetable at
        all. The response carries the full machine-readable list §6 specifies so the
        grid can highlight exactly the cells to fix.

        Cursor paginated, per §16 — the project default (settings
        ``DEFAULT_PAGINATION_CLASS``), so nothing is declared here.
      parameters:
      - in: query
        name: academic_session_id
        schema:
          type: string
          format: uuid
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: room_id
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: section_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - draft
          - published
        description: |-
          * `draft` - Draft
          * `published` - Published
      - in: query
        name: teacher_id
        schema:
          type: string
          format: uuid
      - in: query
        name: weekday
        schema:
          type: integer
      tags:
      - timetable-slots
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTimetableSlotList'
          description: ''
    post:
      operationId: timetable_slots_create
      description: |-
        `timetable_slots` — the weekly grid, cell by cell (§5.2).

        **Every mutation returns `meta.conflicts` and still saves.** §5.5 draws the
        line at publish, not at save: hard conflicts block
        `:publish`, while a grid mid-build is allowed to be temporarily wrong —
        an admin who cannot save an in-progress state cannot build a timetable at
        all. The response carries the full machine-readable list §6 specifies so the
        grid can highlight exactly the cells to fix.

        Cursor paginated, per §16 — the project default (settings
        ``DEFAULT_PAGINATION_CLASS``), so nothing is declared here.
      summary: Add a slot to a section's draft grid
      tags:
      - timetable-slots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableSlot'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TimetableSlot'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TimetableSlot'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableSlot'
          description: The slot, plus `meta.conflicts` for the section (§16).
