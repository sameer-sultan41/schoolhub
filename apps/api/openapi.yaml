        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExam'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExam'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExam'
