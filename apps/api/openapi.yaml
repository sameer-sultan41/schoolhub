    GenerateInvoices:
      type: object
      description: |-
        `POST /fee-invoices:generate` — one structure, one period.

        Exactly one of `period_start` (a calendar month) or `term` names the period.
        A per-term run takes its whole window from the term, so accepting both would
        leave `period_start` silently ignored — and a caller who passed the wrong
        month would get correct-looking invoices for a period they did not ask for.
      properties:
        fee_structure:
          type: string
          format: uuid
        period_start:
          type: string
          format: date
          nullable: true
        term:
          type: string
          format: uuid
          nullable: true
      required:
      - fee_structure
    GradeBand:
      type: object
      description: |-
        `grade_bands` — one band of a grading scale (§5.5).

        The scale is taken from the URL on the nested route, not from the body, so
        `grading_scale_id` is read-only: a band posted to one scale's collection
        naming another scale in its payload is a request with two answers.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        grading_scale_id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          description: e.g. A+, B, Pass.
          maxLength: 10
        min_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Inclusive.
        max_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Inclusive.
        grade_point:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: For GPA scales.
        is_passing:
          type: boolean
        remark:
          type: string
          nullable: true
          maxLength: 100
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - grading_scale_id
      - id
      - label
      - max_percent
      - min_percent
      - updated_at
    GradingScale:
      type: object
      description: |-
        `grading_scales` — a tenant's grading model (§5.5).

        `bands` is nested read-only. A scale is only meaningful with its bands, and
        a client rendering a result needs both in one round trip; writes go through
        the nested `/grade-bands` route so each band gets its own validation and its
        own audit entry.

        `is_default` is read-only here and moves through `:set-default` instead. The
        partial unique index refuses two live defaults, so a plain PATCH setting it
        true would 409 against whichever scale currently holds it — the caller's
        intent is "make this the default", which is two writes, not one.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        scale_type:
          $ref: '#/components/schemas/GradingScaleTypeEnum'
        gpa_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: e.g. 4.00 or 5.00. Required for a gpa or hybrid scale.
        is_default:
          type: boolean
          readOnly: true
          description: One default per tenant; used when an exam names no scale.
        description:
          type: string
          nullable: true
          maxLength: 500
        bands:
          type: array
          items:
            $ref: '#/components/schemas/GradeBand'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bands
      - created_at
      - id
      - is_default
      - name
      - updated_at
    GradingScaleTypeEnum:
      enum:
      - percentage
      - letter
      - gpa
      - hybrid
      type: string
      description: |-
        * `percentage` - Percentage
        * `letter` - Letter grades
        * `gpa` - GPA
        * `hybrid` - Hybrid (letter and GPA)
    GroupByEnum:
