  /api/v1/attendance-corrections:
    get:
      operationId: attendance_corrections_list
      description: |-
        `attendance_corrections` — request a change to a locked row, and decide it (§5.5).

        Append-only from the API's point of view: §16 declares list, create and the
        two decisions, and nothing else. A correction is not edited after the fact —
        that is the whole reason it exists as a row rather than as a direct update.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - cancelled
          - pending
          - rejected
        description: |-
          * `pending` - Pending
          * `approved` - Approved
          * `rejected` - Rejected
          * `cancelled` - Cancelled
      - in: query
        name: student_attendance_id
        schema:
          type: string
          format: uuid
      - in: query
        name: subject_type
        schema:
          type: string
          enum:
          - staff
          - student
        description: |-
          * `student` - Student
          * `staff` - Staff
      tags:
