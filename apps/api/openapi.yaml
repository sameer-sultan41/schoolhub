        description: A search term.
        schema:
          type: string
      - in: query
        name: section_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - pending_approval
          - processing
          - published
        description: |-
          * `processing` - Processing
          * `pending_approval` - Pending approval
          * `approved` - Approved
          * `published` - Published
      - in: query
        name: student_id
        schema:
          type: string
          format: uuid
      tags:
      - results
      security:
