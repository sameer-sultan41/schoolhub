          description: generated_documents(id) — Tier 7, not built yet.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - certificate_document_id
      - created_at
      - decided_at
      - decided_by
      - effective_date
      - id
      - reason
      - status
      - student_id
      - transfer_type
      - updated_at
    StudentTransferStatusEnum:
      enum:
      - requested
      - approved
      - rejected
      - completed
      - cancelled
      type: string
      description: |-
        * `requested` - Requested
        * `approved` - Approved
        * `rejected` - Rejected
        * `completed` - Completed
        * `cancelled` - Cancelled
    Subject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
        subject_type:
          $ref: '#/components/schemas/SubjectTypeEnum'
        department_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
          maxLength: 300
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    SubjectTypeEnum:
      enum:
      - core
      - elective
      - co_curricular
      type: string
      description: |-
        * `core` - Core
        * `elective` - Elective
        * `co_curricular` - Co-curricular
    TeacherAllocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_session_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        is_primary:
          type: boolean
          description: One primary per (section, subject); others are co-teachers.
        weekly_periods:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: Overrides class_subjects.weekly_periods for this allocation's
            load math.
        effective_from:
          type: string
          format: date
          nullable: true
        effective_to:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Null = current. Set rather than deleted on reassignment.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_session_id
      - created_at
      - effective_to
      - id
      - section_id
      - staff_id
      - subject_id
      - updated_at
    TeacherSubstitution:
      type: object
      description: |-
        `teacher_substitutions` — a dated override of one slot's teacher (§7.2).

        `status` is read-only: a proposal is confirmed or declined only through
        `:approve` / `:reject`, which is where the notification and the
        already-decided guard live.

        `room_id` is optional and means "move this class for that date only" (§6).
        Its clash check is in the service, not here, because being free depends on
        the slot's period and the date — neither of which a field validator sees.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        timetable_slot_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Must fall on the slot's weekday and inside the session.
        absent_staff_id:
          type: string
          format: uuid
        substitute_staff_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
          nullable: true
          description: Ad-hoc room change for this date only. Omitted = keep the slot's
            room.
        reason:
          type: string
          nullable: true
          maxLength: 200
        leave_request_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: 'leave_requests(id) — a plain UUID, not an FK: the attendance
            module that owns that table has not shipped yet.'
        status:
          allOf:
          - $ref: '#/components/schemas/TeacherSubstitutionStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - absent_staff_id
      - created_at
      - date
      - id
      - leave_request_id
      - status
      - substitute_staff_id
      - timetable_slot_id
      - updated_at
    TeacherSubstitutionStatusEnum:
      enum:
      - proposed
      - confirmed
      - declined
      - completed
      - cancelled
      type: string
      description: |-
        * `proposed` - Proposed
        * `confirmed` - Confirmed
        * `declined` - Declined
        * `completed` - Completed
        * `cancelled` - Cancelled
    Term:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_session_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        sequence:
          type: integer
          maximum: 32767
          minimum: 0
          description: Order within the session, 1-based.
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_session_id
      - created_at
      - end_date
      - id
      - name
      - sequence
      - start_date
      - updated_at
    TimetableSessionRequest:
      type: object
      description: |-
        Body of `:validate` and `:publish`.

        The session is optional: a school runs one current session at a time and the
        grid UI has no reason to name it, so an omitted value resolves to the
        tenant's `is_current` session (see `TimetableViewSet._resolve_session`).
      properties:
        academic_session_id:
          type: string
          format: uuid
          description: Defaults to the tenant's current session.
    TimetableSlot:
      type: object
      description: |-
        `timetable_slots` — one cell of the weekly grid (§5.2).

        `status` is read-only: a slot becomes published only through
        `POST /timetables/{section_id}:publish`, never by a client writing the field.
        `effective_from`/`effective_to` are read-only for the same reason — they are
        the supersede bookkeeping `publish_section_timetable` writes, and a draft
        that arrived already end-dated would be invisible to the publish it is
        waiting for.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_session_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          maximum: 32767
          minimum: 0
          description: 0-6; the week's start comes from tenant configuration.
        period_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          nullable: true
        staff_id:
          type: string
          format: uuid
          nullable: true
        room_id:
          type: string
          format: uuid
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/TimetableSlotStatusEnum'
          readOnly: true
        effective_from:
          type: string
          format: date
          readOnly: true
          nullable: true
        effective_to:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Null = current. Set on a mid-session revision.
        notes:
          type: string
          nullable: true
          description: Per-cell note, e.g. "double period".
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_session_id
      - created_at
      - day_of_week
      - effective_from
      - effective_to
      - id
      - period_id
      - section_id
      - status
      - updated_at
    TimetableSlotStatusEnum:
      enum:
      - draft
      - published
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
    TransferCompleteRequest:
      type: object
      description: |-
        `section_id` is required only for an inter-campus transfer — see

        services.complete_transfer, which raises a field-specific error when it is
        missing for that type rather than this serializer guessing at a
        conditional-required rule.
      properties:
        section_id:
          type: string
          format: uuid
          nullable: true
    TransferTypeEnum:
      enum:
      - inter_campus
      - outgoing
      - incoming
      type: string
      description: |-
        * `inter_campus` - Inter-campus
        * `outgoing` - Outgoing
        * `incoming` - Incoming
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
          nullable: true
          description: School-issued login for students without email.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_platform:
          type: boolean
          readOnly: true
          description: Platform-scope principal (no tenant).
        mfa_enabled:
          type: boolean
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - first_name
      - full_name
      - id
      - is_platform
      - last_name
      - mfa_enabled
      - permissions
      - phone
      - roles
      - tenant
      - username
    VerificationStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `verified` - Verified
        * `rejected` - Rejected
    VerifyRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DocumentVerificationDecisionEnum'
      required:
      - decision
    VisibilityEnum:
      enum:
      - private
      - public
      type: string
      description: |-
        * `private` - Private
        * `public` - Public
    WithdrawRequest:
      type: object
      properties:
        reason:
          type: string
        effective_date:
          type: string
          format: date
        waive_clearance:
          type: boolean
          default: false
      required:
      - effective_date
      - reason
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
