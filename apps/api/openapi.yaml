  /api/v1/admit-cards:
    get:
      operationId: admit_cards_list
      description: |-
        `/admit-cards` — §5.3's issued cards.

        **No create or update.** §16 declares a `GET` plus two colon-actions and
        nothing else: a card's number is generated so two students can never share
        one, its file is written by a job, and its status moves through
        `:issue-admit-cards` and `:revoke`. A per-row create would bypass all three.

        Portal-readable for reads only; see the module docstring.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: exam_id
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - generated
          - issued
          - revoked
        description: |-
          * `generated` - Generated
          * `issued` - Issued
          * `revoked` - Revoked
      - in: query
        name: student_id
        schema:
          type: string
          format: uuid
      tags:
      - admit-cards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdmitCardList'
          description: ''
  /api/v1/admit-cards/{id}:
    get:
      operationId: admit_cards_retrieve
      description: |-
        `/admit-cards` — §5.3's issued cards.

        **No create or update.** §16 declares a `GET` plus two colon-actions and
        nothing else: a card's number is generated so two students can never share
        one, its file is written by a job, and its status moves through
        `:issue-admit-cards` and `:revoke`. A per-row create would bypass all three.

        Portal-readable for reads only; see the module docstring.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
