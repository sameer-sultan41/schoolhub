components:
  schemas:
    AcademicSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: School year label, e.g. "2026–27".
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicSessionStatusEnum'
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - is_current
      - name
      - start_date
      - status
      - updated_at
    AcademicSessionStatusEnum:
      enum:
      - planned
      - active
      - closed
      - archived
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
        * `archived` - Archived
    Campus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 20
        address:
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        timezone:
          type: string
          nullable: true
          description: IANA identifier. Null inherits the tenant timezone.
          maxLength: 64
        head_staff_id:
          type: string
          format: uuid
          nullable: true
          description: staff(id) — campus head.
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - current_password
      - new_password
    Class:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        code:
          type: string
          nullable: true
          maxLength: 20
        level:
          type: integer
          maximum: 32767
          minimum: 0
          description: Promotion ordering; the next level up is the promotion target.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - level
      - name
      - updated_at
    ClassSubject:
      type: object
      description: 'Curriculum mapping: this class studies this subject in this session.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
          nullable: true
        is_elective:
          type: boolean
        elective_group:
          type: string
          nullable: true
          description: Options sharing a group are mutually choosable ("choose 1 of
