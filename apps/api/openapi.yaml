      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - timetables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Rows published and superseded, plus the accepted soft conflicts.
        '422':
          description: A hard conflict, a locked session, or no draft to publish.
  /api/v1/timetables/{id}:validate:
    post:
      operationId: timetables_:validate_create
      description: |-
        The section-level actions: `:validate` and `:publish` (§16).

        Both are colon-actions on a *section* id, addressed as `/timetables/{id}`
        because what they act on is that section's timetable rather than any one row
        of it. Neither is `@action`-decorated — the routes are explicit `path()`
        entries in urls.py, placed before the routers so the verb is not parsed as a
        primary key.
      summary: Run the full conflict check over a section's timetable
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - timetables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TimetableSessionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: '`conflicts` is the machine-readable list `{type, severity,
            slot_ids, message}` (§6); `has_hard_conflicts` says whether publish would
            be refused.'
  /api/v1/timetables/my:
    get:
      operationId: timetables_my_retrieve
      description: |-
        `GET /timetables/my` — the caller's own effective timetable (§16).

        The **only** endpoint in this module a student or guardian reaches, and
        therefore the only viewset here without ``DenyRestrictedPrincipals``. It
        serves published rows exclusively (``services.effective_slots_for``), so
        §5.7's "unpublished edits never leak" holds by construction rather than by a
        filter someone has to remember.

        Date-aware: a substitution overrides one cell for specific dates only (§7.2),
        so asking without a date gives the base grid and asking with one gives what
        actually happens that day.
      summary: The caller's own effective timetable
      parameters:
      - in: query
        name: academic_session_id
        schema:
          type: string
          format: uuid
        description: Defaults to the tenant's current session.
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Apply confirmed substitutions for this date. Omitted = the base
          grid.
      tags:
      - timetables
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EffectiveSlot'
          description: Published cells with confirmed substitutions applied for `?date=`.
            `meta.audience` says which principal was resolved.
  /api/v1/voucher-collection-imports:
    get:
      operationId: voucher_collection_imports_list
      description: |-
        `/voucher-collection-imports` — §7.2's daily settlement reconciliation.

        Staff-only outright: a settlement file is a bank's record of what it
        collected, and nothing about it belongs in a portal.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - voucher-collection-imports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVoucherCollectionImportList'
          description: ''
    post:
      operationId: voucher_collection_imports_create
      description: |-
        ⚿ `POST /voucher-collection-imports` — 202 + job.

        The file is stored *and* its bytes go into the job payload. Storing it
        is not redundant: a settlement file is a financial record a school has
        to retain, and `file_id` is where an auditor goes for the original. The
        payload is how the worker reads it, matching the platform's established
        import shape.
      tags:
      - voucher-collection-imports
      security:
      - jwtAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/voucher-collection-imports/{id}:
    get:
      operationId: voucher_collection_imports_retrieve
      description: |-
        `/voucher-collection-imports` — §7.2's daily settlement reconciliation.

        Staff-only outright: a settlement file is a bank's record of what it
        collected, and nothing about it belongs in a portal.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this voucher collection import.
        required: true
      tags:
      - voucher-collection-imports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherCollectionImport'
          description: ''
  /api/v1/vouchers:
    get:
      operationId: vouchers_list
      description: |-
        `/vouchers` — §7.2's printable bank/wallet slips.

        Issued from the invoice (`/fee-invoices/{id}/vouchers`), never posted here:
        every field but the provider is derived at issuance, and a client that could
        set the amount could print a voucher for a figure the invoice does not owe.
      parameters:
      - in: query
        name: consumer_number
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: due_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: invoice
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: student
        schema:
          type: string
          format: uuid
      tags:
      - vouchers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeeVoucherList'
          description: ''
  /api/v1/vouchers/{id}:
    get:
      operationId: vouchers_retrieve
      description: |-
        `/vouchers` — §7.2's printable bank/wallet slips.

        Issued from the invoice (`/fee-invoices/{id}/vouchers`), never posted here:
        every field but the provider is derived at issuance, and a client that could
        set the amount could print a voucher for a figure the invoice does not owe.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this fee voucher.
        required: true
      tags:
      - vouchers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeVoucher'
          description: ''
  /api/v1/vouchers/{id}/download:
    get:
      operationId: vouchers_download_retrieve
      description: '`GET /vouchers/{id}/download?format=pdf|thermal`.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - vouchers
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/vouchers/{id}:void:
    post:
      operationId: vouchers_:void_create
      description: '`POST /vouchers/{id}:void` — §7.2''s correction, which is never
        an edit.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - vouchers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Waive'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Waive'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Waive'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeVoucher'
          description: ''
components:
  schemas:
    AcademicSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: School year label, e.g. "2026–27".
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicSessionStatusEnum'
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - is_current
      - name
      - start_date
      - status
      - updated_at
    AcademicSessionStatusEnum:
      enum:
      - planned
      - active
      - closed
      - archived
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
        * `archived` - Archived
    AdmitCard:
      type: object
      description: |-
        `admit_cards` — read-only on the wire (§5.3).

        Every field a client might want to set is set by the module: the number is
        generated so two students can never share one, `file` is written by the
        render job, and `status`/`issued_*` move through `:issue-admit-cards` and
        `:revoke`. There is no create or update endpoint — §16 declares a `GET` and
        two colon-actions, and nothing else.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exam_id:
          type: string
          format: uuid
          readOnly: true
        student_id:
          type: string
          format: uuid
          readOnly: true
        admit_card_no:
          type: string
          readOnly: true
        file_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AdmitCardStatusEnum'
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_reason:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admit_card_no
      - created_at
      - exam_id
      - file_id
      - id
      - issued_at
      - revoked_reason
      - status
      - student_id
      - updated_at
    AdmitCardRevoke:
      type: object
      description: |-
        The body of `POST /admit-cards/{id}:revoke`.

        The reason is required, not optional: a CHECK constraint enforces it too,
        because a revocation nobody can explain is the one a parent will ask about.
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    AdmitCardStatusEnum:
      enum:
      - generated
      - issued
      - revoked
      type: string
      description: |-
        * `generated` - Generated
        * `issued` - Issued
        * `revoked` - Revoked
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        body:
          type: string
          description: Rich text (sanitized HTML/Markdown).
        audience_type:
          $ref: '#/components/schemas/CommunicationAudienceTypeEnum'
        audience_filter:
          nullable: true
          description: Role slugs / class, section, house, campus ids / user ids for
            'custom'.
        campus_id:
          type: string
          format: uuid
          nullable: true
          description: campuses(id); NULL means all campuses.
        status:
          allOf:
          - $ref: '#/components/schemas/AnnouncementStatusEnum'
          readOnly: true
        is_emergency:
          type: boolean
          description: Emergency posts bypass preferences on fan-out.
        publish_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Hidden from feeds after expiry.
        show_on_website:
          type: boolean
        attachments:
          nullable: true
          description: Array of files.id.
        published_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: users(id).
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - published_at
      - published_by
      - status
      - title
      - updated_at
    AnnouncementStatusEnum:
      enum:
      - draft
      - scheduled
      - published
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `scheduled` - Scheduled
        * `published` - Published
        * `archived` - Archived
    AppliesToEnum:
      enum:
      - staff
      - student
      - both
      type: string
      description: |-
        * `staff` - Staff
        * `student` - Student
        * `both` - Both
    AssemblePaper:
      type: object
      description: The body of `POST /question-banks/{id}:assemble-paper` (§16).
      properties:
        title:
          type: string
          maxLength: 150
        sections:
          type: array
          items:
            $ref: '#/components/schemas/PaperSection'
      required:
      - sections
      - title
    AttendanceCorrection:
      type: object
      description: '`attendance_corrections` — the request half. Decisions are colon-actions.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject_type:
          allOf:
          - $ref: '#/components/schemas/AttendanceCorrectionSubjectTypeEnum'
          readOnly: true
        student_attendance_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
          readOnly: true
          description: users(id).
        old_values:
          readOnly: true
          description: Status and times before the change.
        new_values:
          description: Proposed status and times.
        reason:
          type: string
          description: Mandatory justification (§6).
          maxLength: 500
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceCorrectionStatusEnum'
          readOnly: true
        reviewed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: users(id); must differ from requested_by (§11).
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        review_note:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - new_values
      - old_values
      - reason
      - requested_by
      - review_note
      - reviewed_at
      - reviewed_by
      - status
      - student_attendance_id
      - subject_type
      - updated_at
    AttendanceCorrectionStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `cancelled` - Cancelled
    AttendanceCorrectionSubjectTypeEnum:
      enum:
      - student
      - staff
      type: string
      description: |-
        * `student` - Student
        * `staff` - Staff
    AttendanceImportRequest:
      type: object
      description: |-
        `POST /student-attendance-imports` (multipart) — §9's onboarding migration.

        The file rides in the job's own payload rather than through `core.files`'
        two-step presigned flow, for the reason `StudentImportRequestSerializer`
        gives: that flow exists for binary media served back to users later, and an
        import file is read once into the job and never needs a signed URL.

        `academic_session_id` is required and not defaulted to the current session —
        unlike every other endpoint in this module. A historical register belongs to
        a *past* session by definition, so falling back to "current" would file three
        years of history under this year and be almost impossible to unpick.
      properties:
        file:
          type: string
          format: uri
        academic_session_id:
          type: string
          format: uuid
      required:
      - academic_session_id
      - file
    AttendanceReportQuery:
      type: object
      description: |-
        Query parameters for `GET /reports/attendance-summary` (§13, §16).

        One endpoint with a `kind`, not six routes: §16 declares exactly one report
        URL, and the six reports differ in their rows rather than in their shape —
        every one is a flat list under a date range and a record scope.
      properties:
        kind:
          $ref: '#/components/schemas/AttendanceReportQueryKindEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        section_id:
          type: string
          format: uuid
          nullable: true
        threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
        format:
          allOf:
          - $ref: '#/components/schemas/FormatEnum'
          default: csv
      required:
      - kind
      - start_date
    AttendanceReportQueryKindEnum:
      enum:
      - daily-register
      - student-summary
      - defaulters
      - student-late-arrivals
      - staff-punctuality
      - leave
      type: string
      description: |-
        * `daily-register` - daily-register
        * `student-summary` - student-summary
        * `defaulters` - defaulters
        * `student-late-arrivals` - student-late-arrivals
        * `staff-punctuality` - staff-punctuality
        * `leave` - leave
    AttendanceSourceEnum:
      enum:
      - manual
      - system
      - import
      - device
      type: string
      description: |-
        * `manual` - Manual
        * `system` - System
        * `import` - Import
        * `device` - Device
    AttendanceStatusEnum:
      enum:
      - present
      - absent
      - late
      - half_day
      - excused
      - on_leave
      type: string
      description: |-
        * `present` - Present
        * `absent` - Absent
        * `late` - Late
        * `half_day` - Half day
        * `excused` - Excused
        * `on_leave` - On leave
    BackgroundJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_type:
          type: string
          readOnly: true
          description: e.g. 'import.students', 'export.students', 'id-cards.generate'.
        status:
          allOf:
          - $ref: '#/components/schemas/BackgroundJobStatusEnum'
          readOnly: true
        progress:
          type: integer
          readOnly: true
        result:
          readOnly: true
          nullable: true
          description: Result summary, e.g. result_file_id.
        error:
          type: string
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error
      - finished_at
      - id
      - job_type
      - progress
      - result
      - started_at
      - status
      - updated_at
    BackgroundJobStatusEnum:
      enum:
      - queued
      - running
      - succeeded
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        ledger_account:
          type: string
          format: uuid
          nullable: true
        expense_category:
          type: string
          format: uuid
          nullable: true
        campus:
          type: string
          format: uuid
          nullable: true
          description: Null means tenant-wide.
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/BudgetStatusEnum'
          readOnly: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - approved_by
      - created_at
      - id
      - name
      - period_end
      - period_start
      - status
      - updated_at
    BudgetStatusEnum:
      enum:
      - draft
      - approved
      - closed
      type: string
      description: |-
        * `draft` - Draft
        * `approved` - Approved
        * `closed` - Closed
    BulkMark:
      type: object
      description: |-
        `POST /student-attendance:bulk-mark` — one section, one date, one period.

        `academic_session_id` is optional and falls back to the tenant's current
        session: a school runs one at a time and the register UI has no reason to
        carry its id around. `period_id` omitted means daily mode, which is §19's
        recommended default.
      properties:
        section_id:
          type: string
          format: uuid
        academic_session_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
          nullable: true
        attendance_date:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/BulkMarkEntry'
      required:
      - attendance_date
      - entries
      - section_id
    BulkMarkEntry:
      type: object
      description: |-
        One student's row in a submitted register.

        `late_minutes` is deliberately **absent** rather than read-only: a client
        sending it should not have it silently accepted-and-ignored under a name it
        recognises. §11 computes it, and `services._resolve_times` is where.
      properties:
        student_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        check_in_time:
          type: string
          format: time
          nullable: true
        check_out_time:
          type: string
          format: time
