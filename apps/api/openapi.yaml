      - expires_in
    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        payment:
          type: string
          format: uuid
        student:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/RefundStatusEnum'
          readOnly: true
        requested_by:
          type: string
          format: uuid
          readOnly: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        decision_note:
          type: string
          readOnly: true
          nullable: true
        method:
          type: string
          readOnly: true
          nullable: true
        reference_no:
          type: string
          readOnly: true
          nullable: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - approved_by
      - created_at
      - decision_note
      - id
      - method
      - payment
      - processed_at
      - reason
      - reference_no
      - requested_by
      - status
      - student
    RefundDecision:
      type: object
      description: '`:approve` / `:reject` — the note is optional on approval, not
        on refusal.'
      properties:
        note:
          type: string
          maxLength: 2000
    RefundStatusEnum:
      enum:
      - requested
      - approved
      - rejected
      - processed
      type: string
      description: |-
        * `requested` - Requested
        * `approved` - Approved
        * `rejected` - Rejected
        * `processed` - Processed
    RelationshipEnum:
      enum:
      - father
      - mother
      - grandparent
      - sibling
      - legal_guardian
      - other
      type: string
      description: |-
        * `father` - Father
        * `mother` - Mother
        * `grandparent` - Grandparent
        * `sibling` - Sibling
        * `legal_guardian` - Legal guardian
        * `other` - Other
    ReportCard:
      type: object
      description: |-
        `report_cards` — read, plus the two remark fields (§5.7).

        Remarks are the only writable part, and only while the card is a draft:
        §5.7 has a class teacher and a principal write them before generation, and
        editing them on a published card would change a document a parent already
        holds without the version changing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exam_id:
          type: string
          format: uuid
          readOnly: true
        term_id:
          type: string
          format: uuid
          readOnly: true
        student_id:
          type: string
          format: uuid
          readOnly: true
        result_id:
          type: string
          format: uuid
          readOnly: true
        file_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        class_teacher_remarks:
          type: string
          nullable: true
          maxLength: 1000
        principal_remarks:
          type: string
          nullable: true
          maxLength: 1000
        attendance_summary:
          readOnly: true
          nullable: true
          description: Snapshot from the attendance module at generation time.
        version:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ReportCardStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attendance_summary
      - created_at
      - exam_id
      - file_id
      - id
      - published_at
      - result_id
      - status
      - student_id
      - term_id
      - updated_at
      - version
    ReportCardStatusEnum:
      enum:
      - draft
      - generated
      - published
      type: string
      description: |-
        * `draft` - Draft
        * `generated` - Generated
        * `published` - Published
    RequestRefund:
      type: object
      description: ⚿ `POST /refunds` — §7.3 step one.
      properties:
        payment:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
          maxLength: 2000
      required:
      - amount
      - payment
      - reason
    Result:
      type: object
      description: |-
        `results` — read-only on the wire (§16 declares a `GET` and no writes).

        Every field here is computed or moved by a permissioned action: the
        aggregates by `:process-results`, `status`/`approved_*` by
        `:approve-results`, `published_at` by `:publish-results`, and `outcome` by
        processing or `:withhold`. A client that could PATCH any of them could skip
        §5.6's gate entirely, which is the whole point of having one.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exam_id:
          type: string
          format: uuid
          readOnly: true
        student_id:
          type: string
          format: uuid
          readOnly: true
        section_id:
          type: string
          format: uuid
          readOnly: true
        total_max_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        total_obtained_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        grade:
          type: string
          readOnly: true
        gpa:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        rank_in_section:
          type: integer
          readOnly: true
          nullable: true
        rank_in_class:
          type: integer
          readOnly: true
          nullable: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/ResultOutcomeEnum'
          readOnly: true
        grace_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          description: Moderation adjustment; audited (§19).
        status:
          allOf:
          - $ref: '#/components/schemas/ResultStatusEnum'
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_at
      - created_at
      - exam_id
      - gpa
      - grace_marks
      - grade
      - id
      - outcome
      - percentage
