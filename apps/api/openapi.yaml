      description: |-
        Academic sessions and their lifecycle (module doc §5.4, §7).

        No destroy: §16 exposes no DELETE and §4 grants no delete key. A session that
        should no longer be used is closed, which keeps its history addressable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this academic session.
        required: true
      tags:
      - academic-sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSession'
          description: ''
    put:
      operationId: academic_sessions_update
      description: |-
        Academic sessions and their lifecycle (module doc §5.4, §7).

        No destroy: §16 exposes no DELETE and §4 grants no delete key. A session that
        should no longer be used is closed, which keeps its history addressable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
