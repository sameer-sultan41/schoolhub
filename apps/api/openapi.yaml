components:
  schemas:
    AcademicSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: School year label, e.g. "2026–27".
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicSessionStatusEnum'
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - is_current
      - name
      - start_date
      - status
      - updated_at
    AcademicSessionStatusEnum:
      enum:
      - planned
      - active
      - closed
      - archived
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
        * `archived` - Archived
    BackgroundJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_type:
          type: string
          readOnly: true
          description: e.g. 'import.students', 'export.students', 'id-cards.generate'.
        status:
          allOf:
          - $ref: '#/components/schemas/BackgroundJobStatusEnum'
          readOnly: true
        progress:
          type: integer
          readOnly: true
        result:
          readOnly: true
          nullable: true
          description: Result summary, e.g. result_file_id.
        error:
          type: string
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error
      - finished_at
      - id
      - job_type
      - progress
      - result
      - started_at
      - status
      - updated_at
    BackgroundJobStatusEnum:
      enum:
      - queued
      - running
      - succeeded
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
    Campus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 20
        address:
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        timezone:
          type: string
          nullable: true
          description: IANA identifier. Null inherits the tenant timezone.
          maxLength: 64
        head_staff_id:
          type: string
          format: uuid
          nullable: true
          description: staff(id) — campus head.
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - current_password
      - new_password
    ChangeSectionRequest:
      type: object
      properties:
        section_id:
          type: string
          format: uuid
        roll_number:
          type: string
          nullable: true
          maxLength: 16
        capacity_override_reason:
          type: string
          nullable: true
      required:
      - section_id
    Class:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        code:
          type: string
          nullable: true
          maxLength: 20
        level:
          type: integer
          maximum: 32767
          minimum: 0
          description: Promotion ordering; the next level up is the promotion target.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - level
      - name
      - updated_at
    ClassSubject:
      type: object
      description: 'Curriculum mapping: this class studies this subject in this session.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
          nullable: true
        is_elective:
          type: boolean
        elective_group:
          type: string
          nullable: true
          description: Options sharing a group are mutually choosable ("choose 1 of
            N").
          maxLength: 50
        weekly_periods:
          type: integer
          maximum: 32767
          minimum: 1
          description: Target periods per week.
        syllabus_file_id:
          type: string
          format: uuid
          nullable: true
          description: files(id).
        term_plans:
          nullable: true
          description: '[{term_id, topics: [...]}] per-term topic plan.'
        notes:
          type: string
          nullable: true
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_session_id
      - class_id
      - created_at
      - id
      - subject_id
      - updated_at
    DecisionEnum:
      enum:
      - verified
      - rejected
      type: string
      description: |-
        * `verified` - verified
        * `rejected` - rejected
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 20
        department_type:
          $ref: '#/components/schemas/DepartmentTypeEnum'
        campus_id:
          type: string
          format: uuid
          nullable: true
        head_staff_id:
          type: string
          format: uuid
          nullable: true
          description: staff(id) — head of dept.
        description:
          type: string
          nullable: true
          maxLength: 300
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    DepartmentTypeEnum:
      enum:
      - academic
      - administrative
      type: string
      description: |-
        * `academic` - Academic
        * `administrative` - Administrative
    Designation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          nullable: true
          maxLength: 20
        description:
          type: string
          nullable: true
          maxLength: 300
        level:
          type: integer
          maximum: 32767
          minimum: -32768
          nullable: true
          description: Optional seniority ordering.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    DocumentVerifyRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
      required:
      - decision
    EmergencyContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        student_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        relationship:
          type: string
          maxLength: 50
        phone:
          type: string
          maxLength: 32
        alt_phone:
          type: string
          nullable: true
          maxLength: 32
        priority:
          type: integer
          maximum: 32767
          minimum: 0
          description: Call order; 1 = first.
        notes:
          type: string
          nullable: true
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - phone
      - relationship
      - student_id
      - updated_at
    EmploymentStatusEnum:
      enum:
      - active
      - on_leave
      - suspended
      - resigned
      - retired
      - terminated
      type: string
      description: |-
        * `active` - Active
        * `on_leave` - On leave
        * `suspended` - Suspended
        * `resigned` - Resigned
        * `retired` - Retired
        * `terminated` - Terminated
    EmploymentTypeEnum:
      enum:
      - full_time
      - part_time
      - contract
      - visiting
      type: string
      description: |-
        * `full_time` - Full time
        * `part_time` - Part time
        * `contract` - Contract
        * `visiting` - Visiting
    EnrollRequest:
      type: object
      properties:
        academic_session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        enrollment_date:
          type: string
          format: date
        roll_number:
          type: string
          nullable: true
          maxLength: 16
        capacity_override_reason:
          type: string
          nullable: true
      required:
      - academic_session_id
      - class_id
      - enrollment_date
      - section_id
    ExitRequest:
      type: object
      properties:
        exit_date:
          type: string
          format: date
        exit_reason:
          type: string
          maxLength: 300
        exit_type:
          allOf:
          - $ref: '#/components/schemas/ExitTypeEnum'
          default: resigned
      required:
      - exit_date
      - exit_reason
    ExitTypeEnum:
      enum:
      - resigned
      - retired
      - terminated
      type: string
      description: |-
        * `resigned` - resigned
        * `retired` - retired
        * `terminated` - terminated
    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        original_name:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        purpose:
          type: string
          readOnly: true
          description: What this file is for, e.g. 'student.photo', 'student.document'.
        status:
          allOf:
          - $ref: '#/components/schemas/FileStatusEnum'
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - mime_type
      - original_name
      - purpose
      - size_bytes
      - status
      - updated_at
      - visibility
    FileCreate:
      type: object
      description: Input for ``POST /api/v1/files``.
      properties:
        original_name:
          type: string
          maxLength: 255
        mime_type:
          type: string
          maxLength: 120
        size_bytes:
          type: integer
          minimum: 1
        purpose:
          type: string
          maxLength: 40
      required:
      - mime_type
      - original_name
      - purpose
      - size_bytes
    FileStatusEnum:
      enum:
      - pending
      - ready
      - quarantined
      type: string
      description: |-
        * `pending` - Pending
        * `ready` - Ready
        * `quarantined` - Quarantined
    GenderEnum:
      enum:
      - male
      - female
      - other
      - unspecified
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Other
        * `unspecified` - Unspecified
    Guardian:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          nullable: true
          description: users(id) — portal account, tenant-checked at write time.
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          description: Primary contact; indexed for duplicate matching.
          maxLength: 32
        alt_phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        occupation:
          type: string
          nullable: true
          maxLength: 120
        employer:
          type: string
          nullable: true
          maxLength: 200
        national_id:
          type: string
          nullable: true
          maxLength: 64
        photo_file_id:
          type: string
          format: uuid
          nullable: true
        address:
          nullable: true
        custom_fields: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - first_name
      - id
      - last_name
      - phone
      - updated_at
    House:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        code:
          type: string
          nullable: true
          maxLength: 20
        color:
          type: string
          nullable: true
          description: Token or hex.
          maxLength: 20
        motto:
          type: string
          nullable: true
          maxLength: 200
        house_master_staff_id:
          type: string
          format: uuid
          nullable: true
          description: staff(id).
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    IdCardGenerateRequest:
      type: object
      properties:
        student_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required:
      - student_ids
    InviteRequest:
      type: object
      description: |-
        No email is sent (§17 gap — no notification infrastructure exists yet,
        see services.invite_staff's docstring); this only creates and links the
        account plus assigns the requested roles.
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
    Login:
      type: object
      description: |-
        Email/username + password login.

        Deliberately returns the same generic error for unknown accounts and wrong
        passwords so the endpoint cannot be used to enumerate who has an account at
        a school.
      properties:
        identifier:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        school:
          type: string
          writeOnly: true
          description: Tenant slug. Required only when the identifier exists at more
            than one school.
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - identifier
      - password
    PaginatedAcademicSessionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AcademicSession'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                next_cursor:
                  type: string
                  nullable: true
                previous_cursor:
                  type: string
                  nullable: true
                page_size:
                  type: integer
    PaginatedCampusList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Campus'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                next_cursor:
                  type: string
                  nullable: true
                previous_cursor:
                  type: string
                  nullable: true
                page_size:
                  type: integer
    PaginatedClassList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Class'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                next_cursor:
                  type: string
                  nullable: true
                previous_cursor:
                  type: string
                  nullable: true
                page_size:
                  type: integer
    PaginatedClassSubjectList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClassSubject'
        meta:
          type: object
          properties:
            pagination:
