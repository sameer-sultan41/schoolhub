          description: One primary per (section, subject); others are co-teachers.
        weekly_periods:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: Overrides class_subjects.weekly_periods for this allocation's
            load math.
        effective_from:
          type: string
          format: date
          nullable: true
        effective_to:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Null = current. Set rather than deleted on reassignment.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTerm:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_session_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        sequence:
          type: integer
          maximum: 32767
          minimum: 0
          description: Order within the session, 1-based.
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTimetableSlot:
      type: object
      description: |-
        `timetable_slots` — one cell of the weekly grid (§5.2).

        `status` is read-only: a slot becomes published only through
        `POST /timetables/{section_id}:publish`, never by a client writing the field.
        `effective_from`/`effective_to` are read-only for the same reason — they are
        the supersede bookkeeping `publish_section_timetable` writes, and a draft
        that arrived already end-dated would be invisible to the publish it is
        waiting for.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_session_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          maximum: 32767
          minimum: 0
          description: 0-6; the week's start comes from tenant configuration.
        period_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          nullable: true
        staff_id:
          type: string
          format: uuid
          nullable: true
        room_id:
          type: string
          format: uuid
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/TimetableSlotStatusEnum'
          readOnly: true
        effective_from:
          type: string
          format: date
          readOnly: true
          nullable: true
        effective_to:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Null = current. Set on a mid-session revision.
        notes:
          type: string
          nullable: true
          description: Per-cell note, e.g. "double period".
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fee_invoice:
          type: string
          format: uuid
        student:
          type: string
          format: uuid
          readOnly: true
          description: Denormalized from the invoice so the student ledger is one
            query.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        reference_no:
          type: string
          nullable: true
          maxLength: 80
        gateway_provider:
          type: string
          nullable: true
          maxLength: 40
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        received_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Null for a gateway or voucher self-service payment.
        receipt_no:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - fee_invoice
      - id
      - method
      - paid_at
      - receipt_no
      - received_by
      - status
      - student
    PaymentMethodEnum:
      enum:
      - cash
      - cheque
      - bank_transfer
      - card
      - online_gateway
      type: string
      description: |-
        * `cash` - Cash
        * `cheque` - Cheque
        * `bank_transfer` - Bank transfer
        * `card` - Card
        * `online_gateway` - Online gateway
    PaymentStatusEnum:
      enum:
      - pending
      - confirmed
      - failed
      - reversed
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `failed` - Failed
        * `reversed` - Reversed
    Period:
      type: object
      description: |-
        `periods` — one slot of the bell schedule (§5.1).

        `campus_id` is optional and null means "every campus" (models.py), which is
        why it is `allow_null` rather than merely `required=False`: a client editing
        a campus period back to tenant-wide has to be able to say so explicitly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campus_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          description: e.g. "Period 1", "Recess".
          maxLength: 50
        sequence:
          type: integer
          maximum: 32767
          minimum: 0
          description: Daily order, 1-based.
        start_time:
          type: string
          format: time
          description: Local to the tenant/campus timezone.
        end_time:
          type: string
          format: time
        is_break:
          type: boolean
          description: Breaks are never schedulable (§5.1).
        weekdays:
          nullable: true
          description: Applicable weekdays as 0-6; null = the tenant's working days.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_time
      - id
      - name
      - sequence
      - start_time
      - updated_at
    ProcessRefund:
      type: object
      description: ⚿ `:process` — how the money actually went back.
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        reference_no:
          type: string
          nullable: true
          maxLength: 80
      required:
      - method
    PromotionBatch:
      type: object
      description: |-
        A batch, synthesised by aggregating its decision rows.

        There is no `promotion_batches` table — `batch_id` is a grouping column and
        status moves batch-wide, which entities/academics.md settles explicitly. So
        a batch is read-only and derived: its existence, status and shape are
        consequences of its rows rather than a parent record that can drift out of
        sync with them.

        `status` is grouped on rather than picked from a row. If a batch ever
        contained mixed statuses it would surface here as two entries for one
        `batch_id`, which is the honest rendering of a corrupt batch rather than a
        silently chosen winner.
      properties:
        batch_id:
          type: string
          format: uuid
        from_academic_session_id:
          type: string
          format: uuid
        to_academic_session_id:
          type: string
          format: uuid
        from_class_id:
          type: string
          format: uuid
        status:
          type: string
        students:
          type: integer
        started_at:
          type: string
          format: date-time
      required:
      - batch_id
      - from_academic_session_id
      - from_class_id
      - started_at
      - status
      - students
      - to_academic_session_id
    PromotionDecision:
      type: object
      description: |-
        A single student's row inside a batch.

        Only the fields a reviewer edits are writable; everything that defines which
        batch this is, and where the student came from, is fixed at batch creation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        batch_id:
          type: string
          format: uuid
          readOnly: true
          description: Logical batch grouping — one per class per rollover. No batch
            table.
        student_id:
          type: string
          format: uuid
          readOnly: true
        student_name:
          type: string
          readOnly: true
        admission_number:
          type: string
          readOnly: true
        from_enrollment_id:
          type: string
          format: uuid
          readOnly: true
        from_academic_session_id:
          type: string
          format: uuid
          readOnly: true
        to_academic_session_id:
          type: string
          format: uuid
          readOnly: true
        from_class_id:
          type: string
          format: uuid
          readOnly: true
        to_class_id:
          type: string
          format: uuid
          nullable: true
        to_section_id:
          type: string
          format: uuid
          nullable: true
        decision:
          $ref: '#/components/schemas/PromotionDecisionEnum'
        decision_basis:
          readOnly: true
          nullable: true
          description: Snapshot of result aggregates, attendance %, rule evaluation
            at proposal time.
        override_reason:
          type: string
          nullable: true
          description: Required when the decision deviates from the rule proposal.
          maxLength: 500
        remarks:
          type: string
          nullable: true
          maxLength: 500
        status:
          allOf:
          - $ref: '#/components/schemas/PromotionDecisionStatusEnum'
          readOnly: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: users(id) — must differ from the preparer.
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        executed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admission_number
      - approved_at
      - approved_by
      - batch_id
      - created_at
      - decision
      - decision_basis
      - executed_at
      - from_academic_session_id
      - from_class_id
      - from_enrollment_id
      - id
      - status
      - student_id
      - student_name
      - to_academic_session_id
      - updated_at
    PromotionDecisionEnum:
      enum:
      - promoted
      - retained
      - promoted_on_trial
      - graduated
      type: string
      description: |-
        * `promoted` - Promoted
        * `retained` - Retained
        * `promoted_on_trial` - Promoted on trial
        * `graduated` - Graduated
    PromotionDecisionStatusEnum:
      enum:
      - draft
      - pending_approval
