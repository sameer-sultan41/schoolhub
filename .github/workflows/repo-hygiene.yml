name: repo-hygiene

# Deliberately has no `paths:` filter. Every other workflow is app-scoped
# (apps/api/**, apps/dashboard/**, etc.), so a PR touching only docs, AGENTS.md,
# .gitignore, or a workflow file itself would otherwise get zero CI coverage —
# exactly the gap that let a broken link or invalid YAML merge silently.
on:
  push:
    branches: [main]
  pull_request:
    # `main` *and* feature branches, so a **stacked** PR gets the same gate.
    # `pull_request.branches` filters on the branch a PR *targets*, so with
    # `[main]` alone a PR based on another feature branch — which is what PR
    # stacking is — ran none of this: no cspell, no Prettier, no schema-freshness
    # check, no coverage floor, no doc-sync. `api.yml` declares no `branches:` at
    # all and so always ran, which is exactly why the gap was easy to miss: the
    # backend suite went green on a stacked PR while five other gates never fired.
    #
    # GitHub does re-target a stacked PR at `main` once its base merges, which
    # would eventually run these — but "eventually, after the parent merges" is
    # not a gate, and the whole point of stacking is to review the child before
    # then.
    branches: [main, "feat/**", "fix/**", "chore/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Workflow YAML is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every workflow file
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" || { echo "::error file=$f::invalid YAML"; exit 1; }
          done

  markdown-links:
    name: Markdown links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every relative link in every .md file
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, urllib.parse

          broken = []
          for p in pathlib.Path(".").rglob("*.md"):
              if ".git" in p.parts or "node_modules" in p.parts:
                  continue
              text = p.read_text(errors="ignore")
              for m in re.finditer(r'\[([^\]]*)\]\(([^)]+)\)', text):
                  target = m.group(2).strip()
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = urllib.parse.unquote(target.split("#")[0])
                  if clean and not (p.parent / clean).exists():
                      broken.append(f"{p}: {target}")

          if broken:
              print("::error::broken relative links found")
              for b in broken:
                  print(" ", b)
              sys.exit(1)
          print("all relative links resolve")
          PY

  spelling:
    name: Spelling (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cspell
        run: pnpm spell

  formatting:
    name: Formatting (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

  project-status-sync:
    name: project-status.md stays in sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # docs/project-status.md documents its own scope on line 1: "what exists, what is
      # deliberately missing, and where the next session should start — across the
      # backend, both frontends, and infra", and its header rule is "Update this file
      # in the same PR as the work it describes." This job is that rule, enforced — a
      # PR that changes backend or frontend surface area but not the status doc merges
      # a stale doc, which is exactly how docs/frontend-status.md went stale before
      # (Marigold&Indigo/shadcn/E2E all drifted silently across several merged PRs).
      # Scope was widened from apps/dashboard|apps/website|packages|e2e to all of
      # apps/**, packages/**, e2e/** and infra/** when the doc was consolidated to
      # cover the backend too — a backend-only PR is exactly the kind of change most
      # likely to invalidate the per-module implementation matrix.
      - name: Backend- or frontend-surface PRs must update the status doc
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          CHANGED=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$PR_TITLE" | grep -qF '[skip-status-doc]'; then
            echo "Skipping: PR title opts out with [skip-status-doc]."
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^(apps/|packages/|e2e/|infra/)'; then
            if ! echo "$CHANGED" | grep -qxF 'docs/project-status.md'; then
              echo "::error file=docs/project-status.md::This PR changes apps/, packages/, e2e/, or infra/ but does not update docs/project-status.md. Update the 'Done' table, the per-module implementation matrix, and if applicable the 'Deliberately NOT done' / 'Start here next session' sections. If this change genuinely doesn't shift project status (a dependency patch, a typo fix), add [skip-status-doc] to the PR title."
              exit 1
            fi
          fi
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
