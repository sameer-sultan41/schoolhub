name: repo-hygiene

# Deliberately has no `paths:` filter. Every other workflow is app-scoped
# (apps/api/**, apps/dashboard/**, etc.), so a PR touching only docs, AGENTS.md,
# .gitignore, or a workflow file itself would otherwise get zero CI coverage —
# exactly the gap that let a broken link or invalid YAML merge silently.
on:
  push:
    branches: [main]
  pull_request:
    # `main` *and* feature branches, so a **stacked** PR gets the same gate.
    # `pull_request.branches` filters on the branch a PR *targets*, so with
    # `[main]` alone a PR based on another feature branch — which is what PR
    # stacking is — ran none of this: no cspell, no Prettier, no schema-freshness
    # check, no coverage floor, no doc-sync. `api.yml` declares no `branches:` at
    # all and so always ran, which is exactly why the gap was easy to miss: the
    # backend suite went green on a stacked PR while five other gates never fired.
    #
    # GitHub does re-target a stacked PR at `main` once its base merges, which
    # would eventually run these — but "eventually, after the parent merges" is
    # not a gate, and the whole point of stacking is to review the child before
    # then.
    branches: [main, "feat/**", "fix/**", "chore/**", "refactor/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Workflow YAML is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every workflow file
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" || { echo "::error file=$f::invalid YAML"; exit 1; }
          done

  markdown-links:
    name: Markdown links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every relative link in every .md file
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, urllib.parse

          broken = []
          for p in pathlib.Path(".").rglob("*.md"):
              if ".git" in p.parts or "node_modules" in p.parts:
                  continue
              text = p.read_text(errors="ignore")
              for m in re.finditer(r'\[([^\]]*)\]\(([^)]+)\)', text):
                  target = m.group(2).strip()
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean = urllib.parse.unquote(target.split("#")[0])
                  if clean and not (p.parent / clean).exists():
                      broken.append(f"{p}: {target}")

          if broken:
              print("::error::broken relative links found")
              for b in broken:
                  print(" ", b)
              sys.exit(1)
          print("all relative links resolve")
          PY

  spelling:
    name: Spelling (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cspell
        run: pnpm spell

  formatting:
    name: Formatting (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

  project-status-sync:
    name: project-status.md stays in sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # docs/project-status.md documents its own scope on line 1: "what exists, what is
      # deliberately missing, and where the next session should start — across the
      # backend, both frontends, and infra", and its header rule is "Update this file
      # in the same PR as the work it describes." This job is that rule, enforced — a
      # PR that changes backend or frontend surface area but not the status doc merges
      # a stale doc, which is exactly how docs/frontend-status.md went stale before
      # (Marigold&Indigo/shadcn/E2E all drifted silently across several merged PRs).
      # Scope was widened from apps/dashboard|apps/website|packages|e2e to all of
      # apps/**, packages/**, e2e/** and infra/** when the doc was consolidated to
      # cover the backend too — a backend-only PR is exactly the kind of change most
      # likely to invalidate the per-module implementation matrix.
      # docs/deferred-work.md also satisfies the gate: it was split out of the status doc
      # (its old 'Deliberately NOT done' section) to keep that doc short, and recording a
      # deferral is exactly the kind of status change this gate exists to force.
      - name: Backend- or frontend-surface PRs must update the status doc
        run: |
          # No re-fetch: the fetch-depth: 0 checkout already has origin/<base>, and a
          # `git fetch --depth=1` would mark the base tip shallow.
          CHANGED=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$PR_TITLE" | grep -qF '[skip-status-doc]'; then
            echo "Skipping: PR title opts out with [skip-status-doc]."
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^(apps/|packages/|e2e/|infra/)'; then
            if ! echo "$CHANGED" | grep -qxE 'docs/(project-status|deferred-work)\.md'; then
              echo "::error file=docs/project-status.md::This PR changes apps/, packages/, e2e/, or infra/ but updates neither docs/project-status.md nor docs/deferred-work.md. Update project-status.md's 'Done' table, the per-module implementation matrix and 'Start here next session', and/or record deferred items in deferred-work.md. If this change genuinely doesn't shift project status (a dependency patch, a typo fix), add [skip-status-doc] to the PR title."
              exit 1
            fi
          fi
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action reads the PR's commit list to scan only what changed.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The ExitPlanMode gate (.claude/hooks/plan_review_gate.py, ADR-0015) is code that runs in
  # every agent session; a broken path or quote would either trap sessions in plan mode or
  # silently stop gating. Its tests run the exact command registered in .claude/settings.json.
  plan-review-gate:
    name: Plan-review gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the gate's unit tests
        run: python3 -m unittest discover -s .claude/hooks/tests -v

  # Superpowers specs and plans are Tier 2 designs; ADR-0015 requires an independent review
  # before approval, recorded in the file as an `## Independent review` block with a Verdict
  # line. Files dated before the rule (2026-09-26) are grandfathered by their filename date.
  plan-review-record:
    name: Specs and plans carry an independent review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: New or changed specs/plans dated 2026-09-26+ pass the review rule
        # Same rule as the ExitPlanMode gate: the script imports its decide(). HEAD^1 is the
        # base tip of the synthetic merge commit, so no base ref needs fetching.
        run: python3 .claude/hooks/check_review_records.py "HEAD^1"

  # ADR-0016: Conventional Commit subjects, no AI attribution, and a `Root cause:` line on
  # every `fix` commit. The local commit-msg hook runs the same script; this is the authority,
  # since a hook can be skipped or not installed. Merge commits are skipped (--no-merges).
  commit-messages:
    name: Commit messages follow the convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run the checker's unit tests
        run: python3 -m unittest discover -s .githooks/tests -v
      - name: Check every commit in this PR
        # A pull_request checkout's HEAD is GitHub's synthetic merge commit: HEAD^1 is the base
        # tip and HEAD^2 the PR head, so HEAD^1..HEAD^2 is exactly this PR's commits — no base
        # ref to fetch. (A `git fetch --depth=1` here would mark the base tip shallow and widen
        # the range to all history; the script refuses shallow clones for that reason.)
        run: python3 .githooks/lib/check_commit_msg.py --range "HEAD^1..HEAD^2"

  # ADR-0012: a frontend test lives in a sibling __tests__/ folder. The convention was applied
  # once (80f4af0) and drifted back, which is why it is checked rather than written down.
  test-placement:
    name: Frontend tests live in __tests__/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No *.test.ts(x) outside a __tests__/ folder under apps/*/src or packages/*/src
        run: |
          stray=$(git ls-files -- 'apps/*/src/*' 'packages/*/src/*' | grep -E '\.test\.tsx?$' | grep -v '/__tests__/' || true)
          if [ -n "$stray" ]; then
            echo "$stray" | while IFS= read -r f; do
              echo "::error file=$f::Move this test into a sibling __tests__/ folder (ADR-0012)."
            done
            exit 1
          fi
          echo "all frontend tests are in __tests__/ folders"

  # ADR-0014: each workspace's eslint-suppressions.json freezes existing violations and may
  # only shrink. ESLint already fails on stale entries; this stops the file from growing.
  lint-baselines:
    name: Lint baselines only shrink
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run the checker's unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Compare every baseline with the PR's base
        # HEAD^1 is the base tip of the PR's synthetic merge commit.
        run: python3 .github/scripts/check_baselines_shrink.py HEAD^1
