# =============================================================================
# Validate the local development stack and the database bootstrap.
#
# This workflow does NOT build the application images — they live in other
# repos and would make this run take twenty minutes. What it does check is
# everything infra actually owns:
#
#   1. the compose file parses and the pinned image tags are what we think
#   2. the PgBouncer config still says pool_mode = transaction
#   3. .env.example documents every variable the compose file interpolates
#   4. no secrets have been committed
#   5. the init SQL actually runs against PostgreSQL 18 AND the resulting app
#      role really is RLS-bound — asserted against a live database, not by
#      reading the file
#
# Step 5 is the one that matters. Everything else is hygiene.
# =============================================================================

name: compose-validate

on:
  pull_request:
    paths:
      - "infra/compose/**"
      - "infra/postgres/**"
      - "infra/scripts/**"
      - ".github/workflows/infra-compose.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker compose config interpolates variables and fails on anything
      # undefined, so this is also a check that .env.example is complete.
      - name: Render the compose file
        working-directory: compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config > /tmp/rendered.yml
          echo "Services:"
          docker compose config --services | sort

      - name: Assert the pinned image versions
        working-directory: compose
        run: |
          set -euo pipefail
          fail=0
          check() {
            if ! grep -qF "$1" /tmp/rendered.yml; then
              echo "::error::expected image '$1' not found in the rendered compose file"
              fail=1
            fi
          }
          # The versions the whole platform is tested against. A drift here means
          # dev, CI and production stop agreeing about planner and RLS behavior.
          check "postgres:18-alpine"
          check "redis:8-alpine"
          exit "$fail"

      - name: Assert every expected service exists
        working-directory: compose
        run: |
          set -euo pipefail
          expected="api celery-beat celery-worker dashboard mailpit minio pgbouncer postgres redis website"
          actual="$(docker compose config --services | sort | tr '\n' ' ' | sed 's/ *$//')"
          for svc in $expected; do
            case " $actual " in
              *" $svc "*) ;;
              *) echo "::error::service '$svc' is missing from docker-compose.yml"; exit 1 ;;
            esac
          done

      - name: Assert the override example is valid YAML
        working-directory: compose
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open('docker-compose.override.yml.example'))"

  pgbouncer:
    name: pgbouncer config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the ini
        run: python3 -c "import configparser; c=configparser.ConfigParser(); c.read('infra/postgres/pgbouncer/pgbouncer.ini'); print(dict(c['pgbouncer']))"

      # The single most important line in the pooler config. Session pooling
      # would make a stray `SET app.tenant_id` appear to work, and tenant
      # context would then leak between requests in production.
      - name: Assert transaction pooling
        run: |
          set -euo pipefail
          mode="$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('infra/postgres/pgbouncer/pgbouncer.ini'); print(c['pgbouncer']['pool_mode'].strip())")"
          if [ "$mode" != "transaction" ]; then
            echo "::error::pgbouncer pool_mode is '$mode', must be 'transaction'. See infra/postgres/pgbouncer/pgbouncer.ini."
            exit 1
          fi

      - name: Assert SCRAM authentication
        run: |
          set -euo pipefail
          auth="$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('infra/postgres/pgbouncer/pgbouncer.ini'); print(c['pgbouncer']['auth_type'].strip())")"
          if [ "$auth" != "scram-sha-256" ]; then
            echo "::error::pgbouncer auth_type is '$auth'. trust and md5 are not acceptable in any environment."
            exit 1
          fi

  database-roles:
    name: init sql + role assertions
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser-not-a-real-secret
          POSTGRES_DB: schoolhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-superuser-not-a-real-secret
      PGDATABASE: schoolhub

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run the init scripts
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f infra/postgres/init/01-extensions.sql
          psql -v ON_ERROR_STOP=1 \
            -v app_user=schoolhub_app       -v app_password=ci-app-not-a-real-secret \
            -v migration_user=schoolhub_migrator -v migration_password=ci-mig-not-a-real-secret \
            -v readonly_user=schoolhub_readonly  -v readonly_password=ci-ro-not-a-real-secret \
            -f infra/postgres/init/02-app-role.sql

      # ---------------------------------------------------------------------
      # The assertion this entire repository exists to protect.
      # ---------------------------------------------------------------------
      - name: Assert the app role cannot bypass RLS
        run: |
          set -euo pipefail
          result="$(psql -Atc "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname='schoolhub_app'")"
          if [ "$result" != "f" ]; then
            echo "::error::schoolhub_app is a superuser or has BYPASSRLS. Every RLS policy in the platform is a no-op."
            exit 1
          fi

      - name: Assert the app role owns nothing and cannot create
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE owned_by_migrator (id int)"
          owner="$(psql -Atc "SELECT tableowner FROM pg_tables WHERE tablename='owned_by_migrator'")"
          echo "table owner: ${owner}"

          # The app role must be refused CREATE in the public schema. If this
          # command succeeds, the app can create its own tables — and a table
          # created by the app is owned by the app, and an owner is exempt from
          # RLS unless FORCE is set. Deny it at the grant level too.
          if PGPASSWORD=ci-app-not-a-real-secret psql -U schoolhub_app -h localhost -d schoolhub \
               -c "CREATE TABLE app_should_not_create (id int)" 2>/dev/null; then
            echo "::error::schoolhub_app was able to CREATE TABLE. It must have USAGE on the schema, never CREATE."
            exit 1
          fi
          echo "schoolhub_app correctly refused CREATE TABLE"

      - name: Assert RLS actually binds to the app role
        run: |
          set -euo pipefail
          # A miniature of the real schema: one tenant-scoped table, FORCE RLS,
          # the SET LOCAL policy, two tenants' rows.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE students (
              id        uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              tenant_id uuid NOT NULL,
              name      text NOT NULL
          );
          ALTER TABLE students ENABLE ROW LEVEL SECURITY;
          ALTER TABLE students FORCE ROW LEVEL SECURITY;
          CREATE POLICY tenant_isolation ON students
              USING (tenant_id = current_setting('app.tenant_id', true)::uuid)
              WITH CHECK (tenant_id = current_setting('app.tenant_id', true)::uuid);
          GRANT SELECT, INSERT, UPDATE, DELETE ON students TO schoolhub_app;
          INSERT INTO students (tenant_id, name) VALUES
              ('11111111-1111-1111-1111-111111111111', 'School A pupil'),
              ('22222222-2222-2222-2222-222222222222', 'School B pupil');
          SQL

          # With no tenant set the safe default is NO rows, never all rows.
          none="$(PGPASSWORD=ci-app-not-a-real-secret psql -U schoolhub_app -h localhost -d schoolhub -Atc \
            "SELECT count(*) FROM students")"
          if [ "$none" != "0" ]; then
            echo "::error::with no app.tenant_id set, schoolhub_app saw ${none} rows. The safe default must be zero."
            exit 1
          fi

          # With a tenant set inside a transaction, exactly that tenant's row.
          one="$(PGPASSWORD=ci-app-not-a-real-secret psql -U schoolhub_app -h localhost -d schoolhub -At --single-transaction \
            -c "SET LOCAL app.tenant_id = '11111111-1111-1111-1111-111111111111'" \
            -c "SELECT count(*) FROM students" | tail -1)"
          if [ "$one" != "1" ]; then
            echo "::error::with a tenant set, schoolhub_app saw ${one} rows, expected 1."
            exit 1
          fi

          echo "RLS binds correctly to schoolhub_app"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: catch a real .env or userlist.txt before gitleaks has
      # to decide whether its contents look secret.
      - name: Assert no real env or credential files are committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|userlist\.txt$|\.tfvars$' | grep -v '\.example$'; then
            echo "::error::a real environment or credential file is committed. Only *.example files belong in this repository."
            exit 1
          fi
          echo "no credential files committed"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the operational scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning infra/scripts/*.sh

      # These scripts run during an incident, half-awake. `set -euo pipefail` is
      # the difference between a restore that stops on an error and one that
      # cheerfully continues past it.
      - name: Assert strict mode
        run: |
          set -euo pipefail
          for f in infra/scripts/*.sh; do
            if ! grep -q 'set -euo pipefail' "$f"; then
              echo "::error file=$f::missing 'set -euo pipefail'"
              exit 1
            fi
          done
