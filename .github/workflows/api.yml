name: api

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

# Every command below is written relative to the backend, which is no longer the
# repository root.
defaults:
  run:
    working-directory: apps/api

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Python version comes from apps/api/.python-version — setup-uv reads it directly, so
# it is not repeated here (a second copy would just be one more place to forget to bump).
env:
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-api-env
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-api-env
      - run: uv run mypy core apps config

  test:
    runs-on: ubuntu-latest
    services:
      # Tests run against real PostgreSQL: Row-Level Security is the isolation
      # mechanism and cannot be exercised on any other backend.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: schoolhub
          POSTGRES_PASSWORD: schoolhub
          POSTGRES_DB: schoolhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U schoolhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://schoolhub:schoolhub@localhost:5432/schoolhub_test
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: 7Qk2mVx9RbT4wYzA1sHf6JpLn0CdGeUiOa3ZtXrMvB8yNqEcWk5DgSjFhPuT2LiR
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-api-env

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: uv run manage.py migrate

      - name: Tests with coverage
        run: |
          uv run coverage run manage.py test
          uv run coverage report

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/.coverage
          if-no-files-found: ignore

  openapi:
    name: OpenAPI schema is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-api-env
      - name: Regenerate the schema
        run: ./scripts/generate-openapi.sh
        env:
          DJANGO_SECRET_KEY: schema-generation-only
      - name: Fail if the committed schema is stale
        run: |
          if ! git diff --quiet -- openapi.yaml; then
            echo "::error::openapi.yaml is out of date. Run apps/api/scripts/generate-openapi.sh, regenerate the client with 'pnpm --filter @schoolhub/api-client generate', and commit both."
            git diff -- openapi.yaml
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-api-env
      - name: Django deployment checks
        run: uv run manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: 7Qk2mVx9RbT4wYzA1sHf6JpLn0CdGeUiOa3ZtXrMvB8yNqEcWk5DgSjFhPuT2LiR
          DJANGO_ALLOWED_HOSTS: example.com
