name: e2e-live

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC

concurrency:
  group: e2e-live
  cancel-in-progress: false # a nightly run against a real ephemeral stack should finish or time out on its own

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  live:
    name: Live stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `||`, not a bare secrets reference: a secret that was never set resolves to an empty
      # string, not undefined — passed through to a shell `-e VAR`, that sets an actual
      # empty env var, which the seed command's `os.environ.get(key, default)` would
      # return as-is, and which e2e/src/env.ts's zod `min(1)` would reject outright.
      E2E_LIVE_ADMIN_PASSWORD: ${{ secrets.E2E_LIVE_ADMIN_PASSWORD || 'e2e-not-a-real-password' }}
      # A throwaway stack hit by parallel workers from one IP and a handful of shared
      # identities: the production limits (10 logins/min per IP, 60 requests/min per
      # user) throttled nearly every spec on the first run past setup. compose passes
      # these to the API; nothing outside this job sets them.
      THROTTLE_RATE_TENANT: "100000/min"
      THROTTLE_RATE_USER: "100000/min"
      THROTTLE_RATE_ANON: "100000/min"
      THROTTLE_RATE_AUTH: "100000/min"
      THROTTLE_RATE_PUBLIC_FORM: "100000/min"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The backend comes up through the same script a developer runs: .env with
      # random local secrets, PgBouncer's userlist, the RLS assertions, migrations as
      # the migrator, and both seeds. --backend-only leaves the dashboard and website
      # to Playwright's webServer, which builds and serves them as the PR lane does.
      # It runs in the background while the toolchain installs; `wait` takes its exit
      # status, so a failed seed fails this step.
      #
      # No browser cache: Playwright's CI docs advise against it, and `--with-deps`
      # installs OS packages a cache can't hold anyway.
      - name: Bring up the backend while installing the Node/Playwright toolchain
        run: |
          set -euo pipefail
          infra/scripts/seed-dev.sh --backend-only &
          seed_pid=$!
          # A failed install must not leave the seed running into teardown.
          trap 'kill "$seed_pid" 2>/dev/null || true' ERR

          pnpm install --frozen-lockfile
          pnpm --filter @schoolhub/e2e exec playwright install --with-deps chromium

          wait "$seed_pid"

      # seed-dev.sh has already migrated and started the api; this only waits for it
      # to answer.
      - name: Wait for the API to be healthy
        run: timeout 180 bash -c 'until curl -fsS http://localhost:8000/healthz; do sleep 3; done'

      - name: Assert the live project actually has tests to run
        env:
          E2E_NO_SERVER: "1"
        run: |
          set -euo pipefail
          count="$(pnpm --filter @schoolhub/e2e exec playwright test --project=live --list 2>/dev/null | grep -c ' › ' || true)"
          if [ "${count}" -lt 1 ]; then
            echo "::error::the live project matched zero tests — this would otherwise report green for nothing tested"
            exit 1
          fi
          echo "live project has ${count} test(s)"

      # E2E_REAL_API: Playwright serves the dashboard and website (waiting on their
      # readiness probes) but not its tenant-lookup stub, since the real API is up.
      - name: Run the live E2E lane
        env:
          E2E_REAL_API: "1"
          E2E_API_BASE_URL: "http://localhost:8000/api/v1"
          E2E_DASHBOARD_URL: "http://localhost:3000"
          E2E_WEBSITE_URL: "http://localhost:3001"
        run: pnpm --filter @schoolhub/e2e exec playwright test --project=live-setup --project=live

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: e2e/playwright-report/
          retention-days: 14

      - name: Compose logs on failure
        if: failure()
        working-directory: infra/compose
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        working-directory: infra/compose
        run: docker compose down -v
