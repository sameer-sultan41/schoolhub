name: frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "apps/website/**"
      - "packages/**"
      - "e2e/**"
      - "apps/api/openapi.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    # `main` *and* feature branches, so a **stacked** PR gets the same gate.
    # `pull_request.branches` filters on the branch a PR *targets*, so with
    # `[main]` alone a PR based on another feature branch — which is what PR
    # stacking is — ran none of this: no cspell, no Prettier, no schema-freshness
    # check, no coverage floor, no doc-sync. `api.yml` declares no `branches:` at
    # all and so always ran, which is exactly why the gap was easy to miss: the
    # backend suite went green on a stacked PR while five other gates never fired.
    #
    # GitHub does re-target a stacked PR at `main` once its base merges, which
    # would eventually run these — but "eventually, after the parent merges" is
    # not a gate, and the whole point of stacking is to review the child before
    # then.
    branches: [main, "feat/**", "fix/**", "chore/**"]
    paths:
      - "apps/dashboard/**"
      - "apps/website/**"
      - "packages/**"
      - "e2e/**"
      - "apps/api/openapi.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint · Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API types match the committed schema
        run: |
          pnpm --filter @schoolhub/api-client generate
          if ! git diff --quiet -- packages/api-client/src/schema.d.ts; then
            echo "::error::packages/api-client/src/schema.d.ts is stale. Run 'pnpm --filter @schoolhub/api-client generate' and commit the result."
            git diff -- packages/api-client/src/schema.d.ts
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      # Makes the two-TypeScript setup observable: `tsc` must be the native TS 7 from
      # @typescript/native, while tools resolve the TS 6 API. A silent fallback to one
      # version is a regression worth seeing in the log. See root AGENTS.md.
      - name: Report TypeScript versions
        run: |
          echo "tsc (typecheck):    $(pnpm exec tsc --version)"
          echo "typescript (tools): $(node -p "require('typescript').version")"

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Kept out of `verify` on purpose: a coverage-threshold failure here must not skip
      # `build`/`e2e` on an unrelated change — see this job's isolation from `needs:` below.
      - name: Test
        run: pnpm test:coverage

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, website]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        run: pnpm --filter @schoolhub/${{ matrix.app }} build
        env:
          # Build-time public values only — real secrets come from the platform secret store.
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
          NEXT_PUBLIC_APP_URL: https://dashboard.example.invalid
          NEXT_PUBLIC_PLATFORM_DOMAIN: example.invalid
          API_BASE_URL: https://api.example.invalid/api/v1
          WEBSITE_MACHINE_TOKEN: ci-placeholder-token
          REVALIDATE_WEBHOOK_SECRET: ci-placeholder-secret

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the lockfile so a Playwright bump invalidates the cached browser.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: pnpm --filter @schoolhub/e2e exec playwright install --with-deps chromium

      # Only the lanes that need no backend. The `live` project runs against the real
      # compose stack and is not part of the PR gate — see e2e/README.md.
      - name: Run E2E
        run: pnpm --filter @schoolhub/e2e exec playwright test --project=dashboard --project=website

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action reads the PR's commit list to scan only what changed.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
