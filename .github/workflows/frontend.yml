name: frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "apps/website/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "apps/website/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Makes the two-TypeScript setup observable: `tsc` must be the native TS 7 from
      # @typescript/native, while tools resolve the TS 6 API. A silent fallback to one
      # version is a regression worth seeing in the log. See root AGENTS.md.
      - name: Report TypeScript versions
        run: |
          echo "tsc (typecheck):    $(pnpm exec tsc --version)"
          echo "typescript (tools): $(node -p "require('typescript').version")"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, website]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        run: pnpm --filter @schoolhub/${{ matrix.app }} build
        env:
          # Build-time public values only — real secrets come from the platform secret store.
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
          NEXT_PUBLIC_APP_URL: https://dashboard.example.invalid
          NEXT_PUBLIC_PLATFORM_DOMAIN: example.invalid
          API_BASE_URL: https://api.example.invalid/api/v1
          WEBSITE_MACHINE_TOKEN: ci-placeholder-token
          REVALIDATE_WEBHOOK_SECRET: ci-placeholder-secret

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action reads the PR's commit list to scan only what changed.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
